<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Review</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #57606a;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --line: #d0d7de;
      --line-soft: #eaeef2;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --success: #1a7f37;
      --warn: #9a6700;
      --danger: #cf222e;
      --shadow: 0 1px 3px rgba(31, 35, 40, 0.04), 0 8px 24px rgba(31, 35, 40, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside.sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .sb-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .sb-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.35;
      word-break: break-word;
    }

    .sb-meta {
      display: grid;
      gap: 2px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .sb-section-label {
      padding: 14px 16px 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .targets {
      flex: 1;
      overflow: auto;
      padding: 0 8px 8px;
    }

    .target-button {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .target-button:hover { background: var(--line-soft); }
    .target-button.active {
      background: var(--accent-soft);
      border-color: rgba(9, 105, 218, 0.3);
    }

    .target-approved {
      margin-top: 3px;
      cursor: pointer;
    }

    .target-body { min-width: 0; }
    .target-kind {
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .target-label {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 1px;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .target-badges {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-end;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge.approved { background: rgba(26, 127, 55, 0.1); color: var(--success); }
    .badge.needs-change { background: rgba(207, 34, 46, 0.1); color: var(--danger); }
    .badge.question { background: rgba(154, 103, 0, 0.1); color: var(--warn); }
    .badge.out-of-scope { background: rgba(87, 96, 106, 0.1); color: var(--muted); }

    .history {
      border-top: 1px solid var(--line-soft);
      padding: 10px 16px;
      max-height: 28vh;
      overflow: auto;
    }
    .history summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      list-style: none;
    }
    .history summary::-webkit-details-marker { display: none; }
    .history-entry {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      font-size: 12px;
      line-height: 1.45;
    }

    .submit-area {
      display: grid;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line-soft);
    }
    .submit-hint { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .btn-submit {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: var(--success);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-submit:disabled {
      background: #94a3b0;
      cursor: not-allowed;
    }

    main.main {
      width: 100%;
      max-width: 1200px;
      min-width: 0;
      margin: 0 auto;
      padding: 24px 28px 80px;
    }

    .submitted-banner {
      margin-bottom: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(9, 105, 218, 0.45);
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      line-height: 1.45;
    }

    .target-header,
    .toolbar,
    .section-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .target-header {
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .target-title {
      margin: 8px 0 6px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }
    .target-summary {
      margin: 10px 0 0;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.6;
    }

    .toolbar {
      position: sticky;
      top: 8px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px 16px;
    }
    .toolbar label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
    }
    .toolbar-spacer { flex: 1; }

    .sections {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    .section-card {
      overflow: hidden;
    }
    .section-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg);
    }
    .section-head h2 {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
    }
    .section-body {
      padding: 14px;
    }
    .section-body p {
      margin: 0;
      line-height: 1.6;
    }
    .list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .list li {
      padding: 8px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      line-height: 1.45;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .data-table th,
    .data-table td {
      padding: 8px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
    }
    code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .evidence-list {
      display: grid;
      gap: 12px;
    }
    .evidence-item {
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
    }
    .kv-list {
      display: grid;
      gap: 4px;
      margin: 8px 0 10px;
      font-size: 12px;
    }
    .kv-list div {
      display: grid;
      grid-template-columns: 124px minmax(0, 1fr);
      gap: 8px;
    }
    .kv-list dt {
      color: var(--muted);
      font-weight: 700;
    }
    .kv-list dd {
      margin: 0;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .evidence-frame {
      display: block;
      width: 100%;
      min-height: 520px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .comments {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .comment {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fdfdfd;
      padding: 10px 12px;
    }
    .comment-head {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .comment-body {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.55;
    }
    .comment-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .comment-actions button,
    .btn-secondary,
    .btn-primary {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-secondary:disabled,
    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .popup-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
    }
    .popup {
      width: min(560px, 92vw);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }
    .popup h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }
    .popup-anchor {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .type-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .type-row label {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .popup textarea {
      width: 100%;
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 10px;
      resize: vertical;
      font: inherit;
      font-size: 13px;
    }
    .popup-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .empty-main {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 120ms ease, transform 120ms ease;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      font-size: 13px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside.sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .targets { max-height: 42vh; }
      main.main { padding: 16px; }
      .toolbar { position: static; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-header">
        <div class="sb-title" id="sb-title">Planning Review</div>
        <div class="sb-meta" id="sb-meta"></div>
      </div>
      <div class="sb-section-label">Review Targets</div>
      <div class="targets" id="targets"></div>
      <details class="history" id="history-box" style="display:none">
        <summary>History</summary>
        <div id="history-list"></div>
      </details>
      <div class="submit-area">
        <div class="submit-hint" id="submit-hint"></div>
        <button class="btn-submit" id="submit-btn">Submit review</button>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="empty-main">Loading...</div>
    </main>
  </div>
  <div class="toast" id="toast">Saved</div>

  <script>
  (function () {
    "use strict";

    const COMMENT_TYPES = ["needs-change", "question", "out-of-scope"];
    const state = {
      model: null,
      feedback: null,
      history: null,
      items: [],
      activeId: null,
      submitted: false
    };

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#039;"
    }[ch]));
    const asArray = (value) => !value ? [] : Array.isArray(value) ? value : [value];

    function taskSlugFromUrl() {
      const match = window.location.pathname.match(/^\/review\/([A-Za-z0-9_-]+)\/?$/);
      return match ? match[1] : "";
    }

    function apiPath(resource) {
      const taskSlug = taskSlugFromUrl();
      return taskSlug ? `/api/reviews/${taskSlug}/${resource}` : "";
    }

    async function apiGet(resource, fallback) {
      const res = await fetch(apiPath(resource), { cache: "no-store" });
      if (!res.ok) return fallback;
      return res.json();
    }

    async function apiSend(method, resource, body) {
      const res = await fetch(apiPath(resource), {
        method,
        headers: body ? { "content-type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store"
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `${method} ${resource} failed`);
      return data;
    }

    function normalizeAssets(model) {
      const taskSlug = taskSlugFromUrl();
      if (!taskSlug || !model) return model;
      const normalizeOne = (item) => {
        if (!item || typeof item !== "object" || typeof item.asset !== "string") return item;
        if (/^(?:https?:)?\/\//.test(item.asset) || item.asset.startsWith("/")) return item;
        const asset = item.asset.replace(/^assets\//, "");
        return { ...item, asset: `/review-assets/${taskSlug}/${asset}` };
      };
      const normalizeContainer = (container) => {
        if (!container || typeof container !== "object") return;
        if (Array.isArray(container.ui_previews)) container.ui_previews = container.ui_previews.map(normalizeOne);
        if (Array.isArray(container.evidence_artifacts)) container.evidence_artifacts = container.evidence_artifacts.map(normalizeOne);
      };
      normalizeContainer(model.overview);
      asArray(model.phases).forEach(normalizeContainer);
      if (Array.isArray(model.evidence_artifacts)) model.evidence_artifacts = model.evidence_artifacts.map(normalizeOne);
      return model;
    }

    function deriveItems(model) {
      if (Array.isArray(model.review_items) && model.review_items.length) return model.review_items;
      return [
        {
          id: "overview",
          label: "Overview",
          kind: "overview",
          required: true,
          review_item_signature: model.overview?.review_item_signature || "",
          summary: model.overview?.understanding || "",
          anchors: [
            { id: "scope", label: "요청과 범위", kind: "scope" },
            { id: "major-changes", label: "주요 변경점", kind: "section" },
            { id: "risks", label: "핵심 리스크", kind: "risk" }
          ]
        },
        ...asArray(model.phases).map((phase, index) => ({
          id: phase.id || `P${index + 1}`,
          label: phase.title || `Phase ${index + 1}`,
          kind: "phase",
          required: true,
          owner_agent: phase.owner_agent || "",
          review_item_signature: phase.review_item_signature || "",
          summary: phase.goal || "",
          anchors: [
            { id: "changes", label: "변경 내용", kind: "section" },
            { id: "contracts", label: "계약", kind: "contract" },
            { id: "file-impacts", label: "파일 영향", kind: "file-impact" },
            { id: "validation", label: "검증", kind: "validation" },
            { id: "risks", label: "리스크 / 주의점", kind: "risk" }
          ]
        }))
      ];
    }

    function createFeedback(existing) {
      const base = {
        schema_version: 2,
        task_slug: state.model.task_slug,
        plan_signature: state.model.plan_signature,
        review_status: "in_progress",
        updated_at: new Date().toISOString(),
        comments: [],
        item_status: {}
      };
      for (const item of state.items) {
        base.item_status[item.id] = { approved: false };
      }
      if (!existing || typeof existing !== "object") return base;
      if (existing.task_slug && existing.task_slug !== state.model.task_slug) return base;
      if (existing.plan_signature && existing.plan_signature !== state.model.plan_signature) return base;

      if (existing.schema_version === 2 || Array.isArray(existing.comments) || existing.item_status) {
        base.review_status = existing.review_status === "submitted" ? "submitted" : "in_progress";
        base.comments = Array.isArray(existing.comments) ? existing.comments : [];
        for (const item of state.items) {
          const prior = existing.item_status?.[item.id];
          base.item_status[item.id] = prior && typeof prior === "object"
            ? (prior.approved ? { approved: true, approved_against: prior.approved_against || undefined } : { approved: false })
            : { approved: false };
        }
        return base;
      }

      let counter = 1;
      for (const item of state.items) {
        const prior = existing.steps?.[item.id];
        if (!prior || typeof prior !== "object") continue;
        if (prior.status === "approved") {
          base.item_status[item.id] = {
            approved: true,
            approved_against: prior.approved_against
          };
        } else if (COMMENT_TYPES.includes(prior.status)) {
          base.item_status[item.id] = { approved: false };
          base.comments.push({
            id: `cm_${String(counter++).padStart(3, "0")}`,
            target_id: item.id,
            anchor_id: "general",
            type: prior.status,
            body: prior.comment || "",
            created_at: existing.updated_at || new Date().toISOString(),
            updated_at: existing.updated_at || new Date().toISOString()
          });
        }
      }
      return base;
    }

    function itemStatus(itemId) {
      return state.feedback.item_status[itemId] || { approved: false };
    }

    function itemComments(itemId) {
      return asArray(state.feedback.comments).filter((comment) => comment.target_id === itemId);
    }

    function anchorComments(itemId, anchorId) {
      return itemComments(itemId).filter((comment) => comment.anchor_id === anchorId);
    }

    function commentCounts(itemId) {
      const counts = { needsChange: 0, question: 0, outOfScope: 0 };
      for (const comment of itemComments(itemId)) {
        if (comment.type === "needs-change") counts.needsChange += 1;
        if (comment.type === "question") counts.question += 1;
        if (comment.type === "out-of-scope") counts.outOfScope += 1;
      }
      return counts;
    }

    function verdict(itemId) {
      const counts = commentCounts(itemId);
      if (counts.needsChange) return "needs-change";
      if (counts.question) return "question";
      if (counts.outOfScope) return "out-of-scope";
      if (itemStatus(itemId).approved) return "approved";
      return "";
    }

    function historyLabel(value) {
      return {
        approved: "approved",
        "needs-change": "needs-change",
        question: "question",
        "out-of-scope": "out-of-scope",
        answer_only: "answer-only",
        request_lock: "request-lock",
        scope_decision: "scope-decision",
        ui_direction: "ui-direction",
        plan_revision: "plan-revision",
        resolved: "resolved",
        superseded: "superseded"
      }[value] || value;
    }

    function render() {
      state.submitted = state.feedback.review_status === "submitted";
      $("sb-title").textContent = state.model.title || state.model.task_slug || "Planning Review";
      $("sb-meta").innerHTML = `
        <div>task: <strong>${esc(state.model.task_slug || "")}</strong></div>
        <div>signature: <strong>${esc(state.model.plan_signature || "")}</strong></div>
        <div>review: <strong>${esc(state.model.review_outcome || "")}</strong></div>
      `;
      renderTargets();
      renderHistory();
      renderSubmit();
      renderMain();
    }

    function renderTargets() {
      $("targets").innerHTML = state.items.map((item) => {
        const status = itemStatus(item.id);
        const currentVerdict = verdict(item.id);
        const counts = commentCounts(item.id);
        const canApprove = !state.submitted && !counts.needsChange && !counts.question;
        const badges = [];
        if (currentVerdict === "needs-change") badges.push(`<span class="badge needs-change">needs-change (${counts.needsChange})</span>`);
        else if (currentVerdict === "question") badges.push(`<span class="badge question">question (${counts.question})</span>`);
        else if (currentVerdict === "out-of-scope") badges.push(`<span class="badge out-of-scope">out-of-scope</span>`);
        else if (currentVerdict === "approved") badges.push(`<span class="badge approved">approved</span>`);
        return `
          <button class="target-button ${item.id === state.activeId ? "active" : ""}" data-id="${esc(item.id)}">
            <input class="target-approved" type="checkbox" data-approved="${esc(item.id)}" ${status.approved ? "checked" : ""} ${canApprove ? "" : "disabled"} title="Approve target">
            <span class="target-body">
              <span class="target-kind">${esc(item.kind || "item")}</span>
              <span class="target-label">${esc(item.label || item.id)}</span>
            </span>
            <span class="target-badges">${badges.join("")}</span>
          </button>
        `;
      }).join("");
      $("targets").querySelectorAll(".target-button").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (event.target.matches("input")) return;
          state.activeId = button.dataset.id;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
      $("targets").querySelectorAll("[data-approved]").forEach((checkbox) => {
        checkbox.addEventListener("change", async (event) => {
          event.stopPropagation();
          await updateItemStatus(checkbox.dataset.approved, { approved: checkbox.checked });
        });
      });
    }

    function renderHistory() {
      const rounds = asArray(state.history?.rounds);
      $("history-box").style.display = rounds.length ? "" : "none";
      $("history-list").innerHTML = rounds.map((round) => `
        <article class="history-entry">
          <strong>${esc(round.id || "Round")}</strong>
          ${round.submitted_at ? `<div>${esc(round.submitted_at)}</div>` : ""}
          ${round.summary ? `<div>${esc(round.summary)}</div>` : ""}
        </article>
      `).join("");
    }

    function renderSubmit() {
      const required = state.items.filter((item) => item.required !== false);
      const unapproved = required.filter((item) => !itemStatus(item.id).approved);
      const unresolved = asArray(state.feedback.comments).filter((comment) => comment.type !== "out-of-scope");
      const hint = state.submitted
        ? "제출되었습니다. 채팅에 'review complete'라고 알려주세요."
        : `${unapproved.length}개 target 미승인 · ${unresolved.length}개 active comment`;
      $("submit-hint").textContent = hint;
      $("submit-btn").textContent = state.submitted ? "Submitted" : "Submit review";
      $("submit-btn").disabled = state.submitted;
    }

    function activeItem() {
      return state.items.find((item) => item.id === state.activeId) || state.items[0];
    }

    function renderMain() {
      const item = activeItem();
      if (!item) {
        $("main").innerHTML = `<div class="empty-main">review target이 없습니다.</div>`;
        return;
      }
      const status = itemStatus(item.id);
      const counts = commentCounts(item.id);
      const canApprove = !state.submitted && !counts.needsChange && !counts.question;
      $("main").innerHTML = `
        ${state.submitted ? `<div class="submitted-banner">리뷰가 제출되었습니다. 채팅에 <strong>review complete</strong>라고 입력해주세요. 이 화면은 다음 라운드까지 read-only입니다.</div>` : ""}
        <section class="target-header">
          <div class="meta-row">
            <span class="pill">${esc(item.kind || "item")}</span>
            <span>${esc(item.id)}</span>
            ${item.owner_agent ? `<span>owner: <strong>${esc(item.owner_agent)}</strong></span>` : ""}
            ${item.review_item_signature ? `<span>signed</span>` : ""}
          </div>
          <h1 class="target-title">${esc(item.label || item.id)}</h1>
          ${item.summary ? `<p class="target-summary">${esc(item.summary)}</p>` : ""}
        </section>
        <section class="toolbar">
          <label><input id="approved-toggle" type="checkbox" ${status.approved ? "checked" : ""} ${canApprove ? "" : "disabled"}> Approved</label>
          <span class="toolbar-spacer"></span>
          ${verdict(item.id) ? `<span class="badge ${esc(verdict(item.id))}">${esc(historyLabel(verdict(item.id)))}</span>` : `<span class="badge">not reviewed</span>`}
        </section>
        <section class="sections">
          ${renderSections(item)}
        </section>
      `;
      $("approved-toggle")?.addEventListener("change", (event) => updateItemStatus(item.id, { approved: event.target.checked }));
      $("main").querySelectorAll("[data-add-comment]").forEach((button) => {
        button.addEventListener("click", () => openCommentPopup({ target_id: item.id, anchor_id: button.dataset.addComment }));
      });
      $("main").querySelectorAll("[data-edit-comment]").forEach((button) => {
        const comment = state.feedback.comments.find((item) => item.id === button.dataset.editComment);
        if (comment) button.addEventListener("click", () => openCommentPopup(comment));
      });
      $("main").querySelectorAll("[data-delete-comment]").forEach((button) => {
        button.addEventListener("click", () => deleteComment(button.dataset.deleteComment));
      });
    }

    function renderSections(item) {
      const sections = sectionData(item);
      if (!sections.some((section) => section.id === "general") && anchorComments(item.id, "general").length) {
        sections.push({ id: "general", label: "General", html: `<p>이전 형식에서 변환된 코멘트입니다.</p>` });
      }
      if (!sections.length) {
        sections.push({ id: "general", label: "General", html: `<p>검토할 상세 섹션이 없습니다.</p>` });
      }
      return sections.map((section) => `
        <article class="section-card" id="anchor-${esc(section.id)}">
          <div class="section-head">
            <h2>${esc(section.label)}</h2>
            <button class="btn-secondary" data-add-comment="${esc(section.id)}" ${state.submitted ? "disabled" : ""}>Add comment</button>
          </div>
          <div class="section-body">
            ${section.html}
            ${renderComments(item.id, section.id)}
          </div>
        </article>
      `).join("");
    }

    function sectionData(item) {
      if (item.kind === "overview") return overviewSections();
      if (item.kind === "phase") return phaseSections(item.id);
      return [{ id: "general", label: item.label || item.id, html: `<p>${esc(item.summary || "")}</p>` }];
    }

    function overviewSections() {
      const overview = state.model.overview || {};
      const sections = [
        { id: "scope", label: "요청과 범위", html: `${smallList("사용자 요청", overview.user_request)}${smallList("포함 범위", overview.included_scope)}${smallList("제외 범위", overview.excluded_scope)}` },
        { id: "change-shape", label: "변경 형상", html: `<p>${esc(overview.change_shape || "")}</p>${smallList("실행 흐름", overview.change_flow)}` },
        { id: "major-changes", label: "주요 변경점", html: list(overview.major_changes) },
        { id: "risks", label: "핵심 리스크", html: list(overview.risks) },
        { id: "topology", label: "파일/폴더 구조 계약", html: topologyTable(overview.topology_contract || state.model.topology_contract) },
        { id: "evidence", label: "체험 산출물", html: evidenceBlock(overview.evidence_artifacts || state.model.evidence_artifacts) },
        { id: "findings", label: "Plan review findings", html: list(state.model.review_findings) }
      ];
      return sections.filter((section) => section.html && !/class="empty"/.test(section.html));
    }

    function phaseSections(id) {
      const phase = asArray(state.model.phases).find((item) => item.id === id) || {};
      const sections = [
        { id: "goal", label: "목표", html: `<p>${esc(phase.goal || "")}</p>` },
        { id: "changes", label: "변경 내용", html: list(phase.changes) },
        { id: "contracts", label: "계약", html: list(phase.contracts) },
        { id: "file-impacts", label: "파일 영향", html: list(phase.file_impacts) },
        { id: "validation", label: "검증", html: list(phase.validation) },
        { id: "risks", label: "리스크 / 주의점", html: list(phase.risks) },
        { id: "topology", label: "파일/폴더 구조 계약", html: topologyTable(phase.topology_contract) },
        { id: "evidence", label: "체험 산출물", html: evidenceBlock(phase.evidence_artifacts) }
      ];
      return sections.filter((section) => section.html && !/class="empty"/.test(section.html));
    }

    function smallList(title, values) {
      const html = list(values);
      if (/class="empty"/.test(html)) return "";
      return `<h3>${esc(title)}</h3>${html}`;
    }

    function list(values) {
      const items = asArray(values).filter(Boolean);
      if (!items.length) return `<p class="empty">없음</p>`;
      return `<ul class="list">${items.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
    }

    function topologyTable(values) {
      const rows = asArray(values).filter(Boolean);
      if (!rows.length) return `<p class="empty">없음</p>`;
      return `
        <table class="data-table">
          <thead><tr><th>경로</th><th>상태</th><th>Phase</th><th>책임</th></tr></thead>
          <tbody>
            ${rows.map((row) => `
              <tr>
                <td><code>${esc(row.path || "")}</code></td>
                <td>${esc(row.status || "")}</td>
                <td>${esc(row.phase || "")}</td>
                <td>${esc(row.responsibility || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function evidenceBlock(values) {
      const rows = asArray(values).filter(Boolean);
      if (!rows.length) return `<p class="empty">없음</p>`;
      return `
        <div class="evidence-list">
          ${rows.map((item) => {
            const src = item.asset || item.entry || "";
            const canFrame = /\.html?$/i.test(src);
            return `
              <article class="evidence-item">
                <div class="meta-row">
                  <span class="pill">${esc(item.id || "evidence")}</span>
                  ${item.kind ? `<span class="pill">${esc(item.kind)}</span>` : ""}
                  ${item.phase ? `<span class="pill">${esc(item.phase)}</span>` : ""}
                </div>
                <p><strong>${esc(item.purpose || "체험 산출물")}</strong></p>
                ${evidenceDetails(item)}
                ${list(item.review_points)}
                ${src ? `<p><a href="${esc(src)}" target="_blank" rel="noopener">새 창으로 열기</a></p>` : ""}
                ${src && canFrame ? `<iframe class="evidence-frame" sandbox="allow-scripts" src="${esc(src)}" title="${esc(item.id || "evidence")}"></iframe>` : ""}
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function evidenceDetails(item) {
      const rows = [
        ["대상 단위", item.target_unit],
        ["대상 수", item.covered_units],
        ["input", item.input],
        ["function / adapter", item.function_adapter],
        ["output recipient", item.output_recipient],
        ["negative/no-op", item.negative_noop]
      ].filter(([, value]) => value);
      if (!rows.length) return "";
      return `<dl class="kv-list">${rows.map(([key, value]) => `<div><dt>${esc(key)}</dt><dd>${esc(value)}</dd></div>`).join("")}</dl>`;
    }

    function renderComments(itemId, anchorId) {
      const comments = anchorComments(itemId, anchorId);
      if (!comments.length) return "";
      return `
        <div class="comments">
          ${comments.map((comment) => `
            <article class="comment">
              <div class="comment-head">
                <span class="badge ${esc(comment.type)}">${esc(comment.type)}</span>
                <code>${esc(comment.anchor_id)}</code>
                <span class="comment-actions">
                  <button data-edit-comment="${esc(comment.id)}" ${state.submitted ? "disabled" : ""}>Edit</button>
                  <button data-delete-comment="${esc(comment.id)}" ${state.submitted ? "disabled" : ""}>Delete</button>
                </span>
              </div>
              <div class="comment-body">${esc(comment.body || "")}</div>
            </article>
          `).join("")}
        </div>
      `;
    }

    async function updateItemStatus(itemId, patch) {
      try {
        const data = await apiSend("POST", "item-status", { target_id: itemId, ...patch });
        state.feedback = data.feedback || state.feedback;
        render();
        showToast("Saved");
      } catch (error) {
        showToast(error.message || "Save failed");
      }
    }

    function openCommentPopup(comment) {
      const isEdit = Boolean(comment.id);
      const type = comment.type || "needs-change";
      const backdrop = document.createElement("div");
      backdrop.className = "popup-backdrop";
      backdrop.innerHTML = `
        <div class="popup">
          <h3>${isEdit ? "Edit comment" : "New comment"}</h3>
          <div class="popup-anchor">${esc(comment.target_id)} / ${esc(comment.anchor_id)}</div>
          <div class="type-row">
            ${COMMENT_TYPES.map((item) => `
              <label><input type="radio" name="ctype" value="${esc(item)}" ${item === type ? "checked" : ""}> ${esc(item)}</label>
            `).join("")}
          </div>
          <textarea id="popup-body">${esc(comment.body || "")}</textarea>
          <div class="popup-actions">
            <button class="btn-secondary" id="popup-cancel">Cancel</button>
            <button class="btn-primary" id="popup-save">Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.querySelector("#popup-cancel").addEventListener("click", close);
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) close();
      });
      backdrop.querySelector("#popup-save").addEventListener("click", async () => {
        const selectedType = backdrop.querySelector("input[name='ctype']:checked")?.value || "needs-change";
        const payload = {
          target_id: comment.target_id,
          anchor_id: comment.anchor_id,
          type: selectedType,
          body: backdrop.querySelector("#popup-body").value
        };
        try {
          const data = isEdit
            ? await apiSend("PATCH", `comment/${comment.id}`, payload)
            : await apiSend("POST", "comment", payload);
          state.feedback = data.feedback || state.feedback;
          close();
          render();
          showToast("Saved");
        } catch (error) {
          showToast(error.message || "Save failed");
        }
      });
    }

    async function deleteComment(id) {
      if (!window.confirm("이 코멘트를 삭제할까요?")) return;
      try {
        const data = await apiSend("DELETE", `comment/${id}`);
        state.feedback = data.feedback || state.feedback;
        render();
        showToast("Deleted");
      } catch (error) {
        showToast(error.message || "Delete failed");
      }
    }

    async function submitReview() {
      try {
        const data = await apiSend("POST", "submit");
        state.feedback = data.feedback || state.feedback;
        render();
        showToast("Submitted");
      } catch (error) {
        showToast(error.message || "Submit failed");
      }
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    async function init() {
      if (!taskSlugFromUrl()) {
        $("main").innerHTML = `<div class="empty-main">Invalid review URL.</div>`;
        return;
      }
      state.model = normalizeAssets(await apiGet("review-data", null));
      if (!state.model) {
        $("main").innerHTML = `<div class="empty-main">review-data.json을 찾을 수 없습니다.</div>`;
        return;
      }
      state.items = deriveItems(state.model);
      state.activeId = state.items[0]?.id || null;
      state.history = await apiGet("review-history", { rounds: [] });
      state.feedback = createFeedback(await apiGet("feedback", null));
      $("submit-btn").addEventListener("click", submitReview);
      render();
    }

    init().catch((error) => {
      $("main").innerHTML = `<div class="empty-main">리뷰 UI를 불러오지 못했습니다.<br>${esc(error.message)}</div>`;
    });
  })();
  </script>
</body>
</html>
