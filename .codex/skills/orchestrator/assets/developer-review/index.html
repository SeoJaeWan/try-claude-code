<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Review</title>
  <style>
    :root {
      --ink: #17211f;
      --muted: #66736f;
      --paper: #f7f1e6;
      --panel: #fffaf0;
      --line: #dfd1bd;
      --accent: #0f6f5c;
      --accent-ink: #ffffff;
      --warn: #b66b00;
      --danger: #b34040;
      --soft: #e9dfcf;
      --shadow: 0 18px 44px rgba(50, 37, 20, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(15, 111, 92, 0.12), transparent 30%),
        linear-gradient(135deg, #faf4e8 0%, #efe3d0 48%, #f7f1e6 100%);
      font-family: "Aptos", "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.78);
      backdrop-filter: blur(14px);
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    main {
      padding: 36px;
    }

    h1, h2, h3 {
      font-family: "Georgia", "Times New Roman", serif;
      letter-spacing: -0.035em;
      margin: 0;
    }

    h1 {
      font-size: clamp(34px, 5vw, 64px);
      line-height: 0.95;
    }

    h2 {
      font-size: clamp(26px, 3vw, 42px);
      margin-bottom: 12px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .steps {
      display: grid;
      gap: 8px;
      margin-top: 28px;
    }

    .step-button {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 11px 12px;
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .step-button:hover {
      transform: translateX(3px);
      border-color: var(--accent);
    }

    .step-button.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .step-button .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      margin-right: 8px;
      background: var(--line);
      vertical-align: 1px;
    }

    .step-button[data-status="approved"] .status-dot {
      background: #35a36b;
    }

    .step-button[data-status="needs-change"] .status-dot {
      background: var(--danger);
    }

    .step-button[data-status="question"] .status-dot {
      background: var(--warn);
    }

    .step-button[data-status="out-of-scope"] .status-dot {
      background: #68748a;
    }

    .hero {
      background: rgba(255, 250, 240, 0.82);
      border: 1px solid var(--line);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 54px);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -120px;
      top: -130px;
      border-radius: 999px;
      border: 42px solid rgba(15, 111, 92, 0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 22px rgba(50, 37, 20, 0.07);
    }

    .wide {
      grid-column: 1 / -1;
    }

    .list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      padding: 10px 12px;
      background: rgba(233, 223, 207, 0.7);
      border-radius: 12px;
      line-height: 1.45;
    }

    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .flow span {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 700;
    }

    .flow .arrow {
      color: var(--muted);
      font-weight: 900;
    }

    .review-box {
      margin-top: 22px;
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-row button, .nav button, .submit {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
    }

    .status-row button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffaf0;
      color: var(--ink);
      padding: 12px;
      font: inherit;
      line-height: 1.5;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .nav button.primary, .submit {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .preview {
      border: 1px dashed var(--accent);
      background: rgba(15, 111, 92, 0.06);
      border-radius: 18px;
      padding: 16px;
    }

    .preview img {
      display: block;
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      margin-top: 12px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.45;
    }

    .data-table th,
    .data-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    .data-table th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .evidence-list {
      display: grid;
      gap: 16px;
    }

    .evidence-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.92);
      padding: 14px;
    }

    .evidence-frame {
      width: 100%;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      margin-top: 12px;
    }

    .phase-owner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(233, 223, 207, 0.52);
      font-size: 13px;
    }

    .phase-owner-label {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
    }

    .history-list {
      display: grid;
      gap: 14px;
    }

    .history-entry {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.92);
      padding: 16px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .history-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .history-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .history-pill.status-needs-change {
      background: rgba(179, 64, 64, 0.12);
      border-color: rgba(179, 64, 64, 0.28);
      color: var(--danger);
    }

    .history-pill.status-question {
      background: rgba(182, 107, 0, 0.12);
      border-color: rgba(182, 107, 0, 0.28);
      color: var(--warn);
    }

    .history-pill.status-out-of-scope {
      background: rgba(104, 116, 138, 0.14);
      border-color: rgba(104, 116, 138, 0.28);
      color: #556172;
    }

    .history-pill.status-approved,
    .history-pill.resolution-resolved {
      background: rgba(53, 163, 107, 0.12);
      border-color: rgba(53, 163, 107, 0.28);
      color: #24724b;
    }

    .history-row + .history-row {
      margin-top: 10px;
    }

    .history-row strong {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .history-row p {
      margin: 0;
      line-height: 1.55;
    }

    .history-row ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.55;
    }

    .finding {
      border-left: 4px solid var(--warn);
      padding-left: 12px;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      padding: 12px 14px;
      background: var(--ink);
      color: white;
      border-radius: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="eyebrow">Developer Review</div>
      <h3 id="navTitle">Planning Review</h3>
      <div class="meta" id="navMeta"></div>
      <div class="steps" id="steps"></div>
    </aside>
    <main>
      <section class="hero" id="content"></section>
      <section class="review-box" id="reviewBox"></section>
      <nav class="nav">
        <button id="prevBtn">Previous</button>
        <button class="primary" id="nextBtn">Next</button>
      </nav>
    </main>
  </div>
  <div class="toast" id="toast">Saved</div>

  <script>
    const statuses = [
      ["approved", "Approve"],
      ["needs-change", "Needs change"],
      ["question", "Question"],
      ["out-of-scope", "Out of scope"]
    ];

    let model;
    let feedback;
    let reviewHistory;
    let steps = [];
    let current = 0;

    const $ = (id) => document.getElementById(id);

    function asArray(value) {
      if (!value) return [];
      return Array.isArray(value) ? value : [value];
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function canonicalize(value) {
      if (Array.isArray(value)) {
        return value.map(canonicalize);
      }
      if (value && typeof value === "object") {
        const ignored = new Set(["review_item_signature", "signature"]);
        return Object.keys(value)
          .filter((key) => !ignored.has(key) && value[key] !== undefined)
          .sort()
          .reduce((result, key) => {
            result[key] = canonicalize(value[key]);
            return result;
          }, {});
      }
      return value ?? null;
    }

    function hashString(value) {
      let h1 = 0xdeadbeef ^ value.length;
      let h2 = 0x41c6ce57 ^ value.length;
      for (let i = 0; i < value.length; i += 1) {
        const ch = value.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return `rvw-${(h2 >>> 0).toString(16).padStart(8, "0")}${(h1 >>> 0).toString(16).padStart(8, "0")}`;
    }

    function reviewGlobalContext(value) {
      const overview = value?.overview || {};
      return {
        task_slug: value?.task_slug || "",
        title: value?.title || "",
        review_outcome: value?.review_outcome || "",
        review_findings: asArray(value?.review_findings),
        overview_scope: {
          user_request: asArray(overview.user_request),
          included_scope: asArray(overview.included_scope),
          excluded_scope: asArray(overview.excluded_scope),
          change_shape: overview.change_shape || "",
          change_flow: asArray(overview.change_flow),
          major_changes: asArray(overview.major_changes),
          topology_contract: asArray(value?.topology_contract),
          evidence_artifacts: asArray(value?.evidence_artifacts)
        }
      };
    }

    function overviewSignaturePayload(value) {
      const overview = value?.overview || {};
      return {
        kind: "overview",
        id: "overview",
        title: value?.title || "",
        review_outcome: value?.review_outcome || "",
        review_findings: asArray(value?.review_findings),
        overview: {
          user_request: asArray(overview.user_request),
          understanding: overview.understanding || "",
          included_scope: asArray(overview.included_scope),
          excluded_scope: asArray(overview.excluded_scope),
          change_shape: overview.change_shape || "",
          change_flow: asArray(overview.change_flow),
          major_changes: asArray(overview.major_changes),
          risks: asArray(overview.risks),
          ui_previews: asArray(overview.ui_previews),
          topology_contract: asArray(overview.topology_contract),
          evidence_artifacts: asArray(overview.evidence_artifacts)
        }
      };
    }

    function phaseSignaturePayload(value, phase, index) {
      return {
        kind: "phase",
        id: phase?.id || `P${index + 1}`,
        global_context: reviewGlobalContext(value),
        phase: {
          id: phase?.id || `P${index + 1}`,
          title: phase?.title || "",
          owner_agent: phase?.owner_agent || "",
          goal: phase?.goal || "",
          changes: asArray(phase?.changes),
          contracts: asArray(phase?.contracts),
          file_impacts: asArray(phase?.file_impacts),
          validation: asArray(phase?.validation),
          risks: asArray(phase?.risks),
          ui_previews: asArray(phase?.ui_previews),
          topology_contract: asArray(phase?.topology_contract),
          evidence_artifacts: asArray(phase?.evidence_artifacts)
        }
      };
    }

    function reviewItemSignatureFromPayload(payload) {
      return hashString(JSON.stringify(canonicalize(payload)));
    }

    function attachReviewItemSignatures(value) {
      if (!value || typeof value !== "object") return value;
      if (value.overview && typeof value.overview === "object" && !value.overview.review_item_signature) {
        value.overview.review_item_signature = reviewItemSignatureFromPayload(overviewSignaturePayload(value));
      }
      asArray(value.phases).forEach((phase, index) => {
        if (phase && typeof phase === "object" && !phase.review_item_signature) {
          phase.review_item_signature = reviewItemSignatureFromPayload(phaseSignaturePayload(value, phase, index));
        }
      });
      return value;
    }

    function reviewItemSignature(step) {
      return step?.review_item_signature || "";
    }

    function approvalEvidence(step, approvedAt = null, carriedFromPlanSignature = null) {
      const carriedFrom = carriedFromPlanSignature && carriedFromPlanSignature !== model.plan_signature
        ? carriedFromPlanSignature
        : null;
      return {
        plan_signature: model.plan_signature,
        review_item_signature: reviewItemSignature(step),
        approved_at: approvedAt || new Date().toISOString(),
        carried_from_plan_signature: carriedFrom
      };
    }

    function isFreshApproval(item, step) {
      return item?.status === "approved" &&
        Boolean(reviewItemSignature(step)) &&
        item?.approved_against?.review_item_signature === reviewItemSignature(step);
    }

    function markEdited() {
      if (feedback.review_status === "submitted") {
        feedback.review_status = "in_progress";
      }
    }

    function list(items) {
      const normalized = asArray(items).filter(Boolean);
      if (!normalized.length) return "<p class=\"meta\">없음</p>";
      return `<ul class="list">${normalized.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
    }

    function flow(items) {
      const normalized = asArray(items).filter(Boolean);
      if (!normalized.length) return "";
      return `<div class="flow">${normalized.map((item, index) => `${index ? "<b class=\"arrow\">→</b>" : ""}<span>${esc(item)}</span>`).join("")}</div>`;
    }

    function previewBlock(previews) {
      const items = asArray(previews).filter(Boolean);
      if (!items.length) return "";
      return items.map((preview) => `
        <div class="preview">
          <strong>${esc(preview.id || "UI")}. ${esc(preview.title || "UI preview")}</strong>
          <p>${esc(preview.description || "화면이 어떤 식으로 나타날지 보여주는 계획 preview입니다.")}</p>
          ${preview.asset ? `<img src="${esc(preview.asset)}" alt="${esc(preview.title || "UI preview")}">` : ""}
        </div>
      `).join("");
    }

    function topologyTable(items) {
      const rows = asArray(items).filter(Boolean);
      if (!rows.length) return "";
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>경로</th>
              <th>상태</th>
              <th>종류</th>
              <th>Phase</th>
              <th>책임</th>
              <th>근거</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((item) => `
              <tr>
                <td><code>${esc(item.path || "")}</code></td>
                <td>${item.status ? `<span class="pill">${esc(item.status)}</span>` : ""}</td>
                <td>${esc(item.kind || "")}</td>
                <td>${esc(item.phase || "")}</td>
                <td>${esc(item.responsibility || "")}</td>
                <td>${esc(item.evidence || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function evidenceBlock(items) {
      const artifacts = asArray(items).filter(Boolean);
      if (!artifacts.length) return "";
      return `
        <div class="evidence-list">
          ${artifacts.map((item) => {
            const src = item.asset || item.entry || "";
            const canFrame = /\.html?$/i.test(src);
            return `
              <article class="evidence-item">
                <div class="history-pills">
                  <span class="history-pill">${esc(item.id || "evidence")}</span>
                  ${item.kind ? `<span class="history-pill">${esc(item.kind)}</span>` : ""}
                  ${item.phase ? `<span class="history-pill">${esc(item.phase)}</span>` : ""}
                </div>
                <p><strong>${esc(item.purpose || "체험 산출물")}</strong></p>
                ${asArray(item.review_points).length ? list(item.review_points) : ""}
                ${item.entry ? `<p class="meta">source: <code>${esc(item.entry)}</code>${item.content_hash ? ` · hash: <code>${esc(item.content_hash)}</code>` : ""}</p>` : ""}
                ${src ? `
                  ${canFrame
                    ? `<iframe class="evidence-frame" sandbox="allow-scripts" src="${esc(src)}" title="${esc(item.id || "evidence")}"></iframe>`
                    : `<p><a href="${esc(src)}" target="_blank" rel="noopener">Open evidence asset</a></p>`}
                ` : ""}
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function cssToken(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
    }

    function historyLabel(value) {
      return {
        approved: "Approved",
        "needs-change": "Needs Change",
        question: "Question",
        "out-of-scope": "Out of Scope",
        answer_only: "Answer Only",
        request_lock: "Request Lock",
        scope_decision: "Scope Decision",
        ui_direction: "UI Direction",
        plan_revision: "Plan Revision",
        resolved: "Resolved",
        active: "Active",
        superseded: "Superseded"
      }[value] || value;
    }

    function createHistoryFallback() {
      return {
        schema_version: 1,
        task_slug: model?.task_slug || "",
        current_plan_signature: model?.plan_signature || "",
        rounds: []
      };
    }

    function historyRounds() {
      return asArray(reviewHistory?.rounds).filter((round) => round && typeof round === "object");
    }

    function normalizedHistoryEntries(stepId) {
      const entries = [];
      historyRounds().forEach((round, roundIndex) => {
        asArray(round.items).forEach((item) => {
          if (!item || typeof item !== "object") return;
          if (stepId && item.step_id !== stepId) return;
          entries.push({
            roundId: round.id || `R${roundIndex + 1}`,
            stepId: item.step_id || "",
            stepLabel: item.step_label || item.step_id || "",
            submittedAt: round.submitted_at || round.updated_at || "",
            sourcePlanSignature: round.source_plan_signature || round.plan_signature || "",
            resultingPlanSignature: item.resulting_plan_signature || round.resulting_plan_signature || "",
            resolutionState: item.resolution_state || round.resolution_state || "",
            summary: item.resolution_summary || round.summary || "",
            userStatus: item.user_status || "",
            userComment: item.user_comment || "",
            triageRoute: item.triage_route || round.triage_route || "",
            actionSummary: asArray(item.action_summary).filter(Boolean)
          });
        });
      });
      return entries;
    }

    function renderHistoryEntries(entries, options = {}) {
      const { emptyText = "아직 기록된 리뷰 이력이 없습니다.", showStepLabel = false } = options;
      if (!entries.length) return `<p class="meta">${esc(emptyText)}</p>`;
      return `
        <div class="history-list">
          ${entries.map((entry) => `
            <article class="history-entry">
              <div class="history-meta">
                Round ${esc(entry.roundId)}
                ${entry.submittedAt ? ` · ${esc(entry.submittedAt)}` : ""}
                ${entry.sourcePlanSignature ? ` · from ${esc(entry.sourcePlanSignature)}` : ""}
                ${entry.resultingPlanSignature ? ` · to ${esc(entry.resultingPlanSignature)}` : ""}
              </div>
              <div class="history-pills">
                ${entry.userStatus ? `<span class="history-pill status-${cssToken(entry.userStatus)}">${esc(historyLabel(entry.userStatus))}</span>` : ""}
                ${entry.triageRoute ? `<span class="history-pill route-${cssToken(entry.triageRoute)}">${esc(historyLabel(entry.triageRoute))}</span>` : ""}
                ${entry.resolutionState ? `<span class="history-pill resolution-${cssToken(entry.resolutionState)}">${esc(historyLabel(entry.resolutionState))}</span>` : ""}
              </div>
              ${showStepLabel && entry.stepLabel ? `
                <div class="history-row">
                  <strong>대상 step</strong>
                  <p>${esc(entry.stepLabel)}</p>
                </div>
              ` : ""}
              <div class="history-row">
                <strong>사용자 리뷰</strong>
                <p>${esc(entry.userComment || "코멘트 없음")}</p>
              </div>
              ${entry.actionSummary.length ? `
                <div class="history-row">
                  <strong>조치</strong>
                  <ul>${entry.actionSummary.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
                </div>
              ` : ""}
              ${entry.summary ? `
                <div class="history-row">
                  <strong>결과</strong>
                  <p>${esc(entry.summary)}</p>
                </div>
              ` : ""}
            </article>
          `).join("")}
        </div>
      `;
    }

    async function loadJson(path, fallback) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) return fallback;
      return res.json();
    }

    function taskSlugFromUrl() {
      const match = window.location.pathname.match(/^\/review\/([A-Za-z0-9_-]+)$/);
      return match ? match[1] : "";
    }

    function apiPath(resource) {
      const taskSlug = taskSlugFromUrl();
      if (!taskSlug) return "";
      return `/api/reviews/${taskSlug}/${resource}`;
    }

    function normalizePreviewAssets(value) {
      const taskSlug = taskSlugFromUrl();
      if (!taskSlug || !value) return value;

      const normalizeOne = (item) => {
        if (!item || typeof item !== "object" || typeof item.asset !== "string") {
          return item;
        }
        if (/^(?:https?:)?\/\//.test(item.asset) || item.asset.startsWith("/")) {
          return item;
        }
        const asset = item.asset.replace(/^assets\//, "");
        return { ...item, asset: `/review-assets/${taskSlug}/${asset}` };
      };

      const normalizeContainer = (container) => {
        if (!container || typeof container !== "object") return;
        if (Array.isArray(container.ui_previews)) {
          container.ui_previews = container.ui_previews.map(normalizeOne);
        }
        if (Array.isArray(container.evidence_artifacts)) {
          container.evidence_artifacts = container.evidence_artifacts.map(normalizeOne);
        }
      };

      normalizeContainer(value.overview);
      asArray(value.phases).forEach(normalizeContainer);
      if (Array.isArray(value.evidence_artifacts)) {
        value.evidence_artifacts = value.evidence_artifacts.map(normalizeOne);
      }
      return value;
    }

    async function init() {
      const reviewDataPath = apiPath("review-data");
      if (!reviewDataPath) {
        $("content").innerHTML = "<h1>Invalid review URL.</h1>";
        return;
      }

      model = await loadJson(reviewDataPath, null);
      if (!model) {
        $("content").innerHTML = "<h1>review-data.json을 찾을 수 없습니다.</h1>";
        return;
      }
      attachReviewItemSignatures(model);
      model = normalizePreviewAssets(model);

      reviewHistory = await loadJson(apiPath("review-history"), createHistoryFallback());
      const existing = await loadJson(apiPath("feedback"), null);

      steps = [
        {
          id: "overview",
          label: "Overview",
          kind: "overview",
          review_item_signature: model.overview?.review_item_signature || ""
        },
        ...asArray(model.phases).map((phase, index) => ({
          id: phase.id || `P${index + 1}`,
          label: phase.title || `Phase ${index + 1}`,
          kind: "phase",
          review_item_signature: phase.review_item_signature || "",
          phase
        })),
        {
          id: "final",
          label: "Final",
          kind: "final",
          review_item_signature: `final-${model.plan_signature || ""}`
        }
      ];

      feedback = createFeedback();
      mergeExistingFeedback(existing);
      ensureStepFeedback();
      render();
    }

    function createFeedback() {
      return {
        schema_version: 1,
        task_slug: model.task_slug,
        plan_signature: model.plan_signature,
        review_status: "in_progress",
        updated_at: new Date().toISOString(),
        steps: {},
        cards: {}
      };
    }

    function mergeExistingFeedback(existing) {
      if (!existing || typeof existing !== "object") return;
      if (existing.task_slug && existing.task_slug !== model.task_slug) return;

      const samePlan = existing.plan_signature === model.plan_signature;
      if (samePlan && existing.review_status === "submitted") {
        feedback.review_status = "submitted";
      }

      steps.forEach((step) => {
        const prior = existing.steps?.[step.id];
        if (!prior || typeof prior !== "object") return;

        const next = {
          status: typeof prior.status === "string" ? prior.status : "",
          comment: typeof prior.comment === "string" ? prior.comment : ""
        };

        if (samePlan) {
          if (next.status === "approved") {
            if (isFreshApproval(prior, step) || !prior.approved_against) {
              next.approved_against = approvalEvidence(
                step,
                prior.approved_against?.approved_at,
                prior.approved_against?.carried_from_plan_signature
              );
            } else {
              next.status = "";
              next.comment = "";
            }
          }
          feedback.steps[step.id] = next;
          return;
        }

        if (isFreshApproval(prior, step)) {
          const carriedFrom = prior.approved_against?.carried_from_plan_signature ||
            prior.approved_against?.plan_signature ||
            existing.plan_signature ||
            null;
          feedback.steps[step.id] = {
            status: "approved",
            comment: next.comment,
            approved_against: approvalEvidence(step, prior.approved_against?.approved_at, carriedFrom)
          };
        }
      });
    }

    function ensureStepFeedback() {
      if (!feedback.steps || typeof feedback.steps !== "object") {
        feedback.steps = {};
      }
      steps.forEach((step) => {
        if (!feedback.steps[step.id]) {
          feedback.steps[step.id] = { status: "", comment: "" };
        }
      });
    }

    function stepStatus(id) {
      return feedback.steps[id]?.status || "";
    }

    function render() {
      $("navTitle").textContent = model.title || model.task_slug || "Planning Review";
      $("navMeta").innerHTML = `
        <div>task: <strong>${esc(model.task_slug || "")}</strong></div>
        <div>signature: <strong>${esc(model.plan_signature || "")}</strong></div>
        <div>review: <strong>${esc(model.review_outcome || "")}</strong></div>
      `;
      renderSteps();
      renderContent();
      renderFeedbackBox();
      $("prevBtn").disabled = current === 0;
      $("nextBtn").textContent = current === steps.length - 1 ? "Submit review" : "Next";
    }

    function renderSteps() {
      $("steps").innerHTML = steps.map((step, index) => `
        <button class="step-button ${index === current ? "active" : ""}" data-status="${esc(stepStatus(step.id))}" onclick="go(${index})">
          <span class="status-dot"></span>${esc(step.label)}
        </button>
      `).join("");
    }

    function renderContent() {
      const step = steps[current];
      if (step.kind === "overview") renderOverview();
      if (step.kind === "phase") renderPhase(step.phase, step.id);
      if (step.kind === "final") renderFinal();
    }

    function renderOverview() {
      const overview = model.overview || {};
      const history = normalizedHistoryEntries("overview");
      $("content").innerHTML = `
        <div class="eyebrow">Overview</div>
        <h1>${esc(model.title || model.task_slug || "Plan Review")}</h1>
        <p class="meta">${esc(overview.understanding || "요청을 바탕으로 이해한 전체 방향을 검토합니다.")}</p>
        <div class="grid">
          <article class="card"><h3>사용자 요청</h3>${list(overview.user_request)}</article>
          <article class="card"><h3>포함 범위</h3>${list(overview.included_scope)}</article>
          <article class="card"><h3>제외 범위</h3>${list(overview.excluded_scope)}</article>
          <article class="card"><h3>주요 변경점</h3>${list(overview.major_changes)}</article>
          <article class="card wide"><h3>변경 형상</h3><p>${esc(overview.change_shape || "")}</p>${flow(overview.change_flow)}</article>
          <article class="card wide"><h3>핵심 리스크</h3>${list(overview.risks)}</article>
          ${topologyTable(overview.topology_contract || model.topology_contract) ? `<article class="card wide"><h3>파일/폴더 구조 계약</h3>${topologyTable(overview.topology_contract || model.topology_contract)}</article>` : ""}
          ${evidenceBlock(overview.evidence_artifacts || model.evidence_artifacts) ? `<article class="card wide"><h3>체험 산출물</h3>${evidenceBlock(overview.evidence_artifacts || model.evidence_artifacts)}</article>` : ""}
          ${history.length ? `<article class="card wide"><h3>이전 리뷰와 조치</h3>${renderHistoryEntries(history, { emptyText: "이전 overview 리뷰 이력이 없습니다." })}</article>` : ""}
          ${previewBlock(overview.ui_previews) ? `<article class="card wide"><h3>UI 계획 preview</h3>${previewBlock(overview.ui_previews)}</article>` : ""}
        </div>
      `;
    }

    function renderPhase(phase, stepId) {
      const history = normalizedHistoryEntries(stepId);
      $("content").innerHTML = `
        <div class="eyebrow">${esc(stepId)}</div>
        <h1>${esc(phase.title || stepId)}</h1>
        <p class="meta">${esc(phase.goal || "이 phase의 목표와 실행 계약을 검토합니다.")}</p>
        ${phase.owner_agent ? `
          <div class="phase-owner">
            <span class="phase-owner-label">담당 agent</span>
            <strong>${esc(phase.owner_agent)}</strong>
          </div>
        ` : ""}
        <div class="grid">
          <article class="card"><h3>변경 내용</h3>${list(phase.changes)}</article>
          <article class="card"><h3>검증</h3>${list(phase.validation)}</article>
          <article class="card wide"><h3>계약</h3>${list(phase.contracts)}</article>
          <article class="card wide"><h3>파일 영향</h3>${list(phase.file_impacts)}</article>
          ${topologyTable(phase.topology_contract) ? `<article class="card wide"><h3>파일/폴더 구조 계약</h3>${topologyTable(phase.topology_contract)}</article>` : ""}
          ${evidenceBlock(phase.evidence_artifacts) ? `<article class="card wide"><h3>체험 산출물</h3>${evidenceBlock(phase.evidence_artifacts)}</article>` : ""}
          <article class="card wide"><h3>리스크 / 주의점</h3>${list(phase.risks)}</article>
          ${history.length ? `<article class="card wide"><h3>이전 리뷰와 조치</h3>${renderHistoryEntries(history, { emptyText: "이전 phase 리뷰 이력이 없습니다." })}</article>` : ""}
          ${previewBlock(phase.ui_previews) ? `<article class="card wide"><h3>UI 계획 preview</h3>${previewBlock(phase.ui_previews)}</article>` : ""}
        </div>
      `;
    }

    function renderFinal() {
      const findings = asArray(model.review_findings);
      const history = normalizedHistoryEntries("");
      const nextLabel = model.post_approval_next_label || "다음 단계: $plan-tdd";
      const nextSummary = model.post_approval_next_summary || "모든 step이 승인되면 production code 구현 전에 승인된 plan.md 기준으로 TDD 계약 테스트를 작성합니다.";
      const stepRows = steps.filter((step) => step.kind !== "final").map((step) => {
        const item = feedback.steps[step.id] || {};
        return `<li><strong>${esc(step.label)}</strong>: ${esc(item.status || "not reviewed")} ${item.comment ? `— ${esc(item.comment)}` : ""}</li>`;
      }).join("");

      $("content").innerHTML = `
        <div class="eyebrow">Final</div>
        <h1>리뷰 제출</h1>
        <p class="meta">모든 step의 승인/수정 요청을 확인한 뒤 제출합니다. 제출 후 채팅에 <strong>리뷰 완료</strong>라고 알려주세요.</p>
        <div class="grid">
          <article class="card wide"><h3>Step 상태</h3><ul class="list">${stepRows}</ul></article>
          <article class="card wide"><h3>${esc(nextLabel)}</h3><p>${esc(nextSummary)}</p></article>
          <article class="card wide"><h3>Plan review findings</h3>${findings.length ? findings.map((item) => `<p class="finding">${esc(item)}</p>`).join("") : "<p class=\"meta\">없음</p>"}</article>
          ${history.length ? `<article class="card wide"><h3>리뷰 이력과 조치 요약</h3>${renderHistoryEntries(history, { emptyText: "기록된 리뷰 이력이 없습니다.", showStepLabel: true })}</article>` : ""}
        </div>
      `;
    }

    function renderFeedbackBox() {
      const step = steps[current];
      const item = feedback.steps[step.id] || { status: "", comment: "" };
      $("reviewBox").innerHTML = `
        <h3>이 step 리뷰</h3>
        <div class="status-row">
          ${statuses.map(([value, label]) => `<button class="${item.status === value ? "active" : ""}" onclick="setStatus('${value}')">${label}</button>`).join("")}
        </div>
        <textarea id="comment" placeholder="수정 요청이나 질문을 적어주세요.">${esc(item.comment || "")}</textarea>
      `;
      $("comment").addEventListener("input", (event) => {
        markEdited();
        feedback.steps[step.id].comment = event.target.value;
        saveDebounced();
      });
    }

    function setStatus(status) {
      const step = steps[current];
      markEdited();
      feedback.steps[step.id].status = status;
      if (status === "approved") {
        feedback.steps[step.id].approved_against = approvalEvidence(
          step,
          feedback.steps[step.id].approved_against?.approved_at,
          feedback.steps[step.id].approved_against?.carried_from_plan_signature
        );
      } else {
        delete feedback.steps[step.id].approved_against;
      }
      saveDebounced();
      render();
    }

    function scrollStepTop() {
      const content = $("content");
      if (content?.scrollIntoView) {
        content.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function go(index) {
      current = Math.max(0, Math.min(index, steps.length - 1));
      render();
      scrollStepTop();
    }

    async function save(submitted = false) {
      if (submitted) {
        steps.forEach((step) => {
          const item = feedback.steps[step.id];
          if (!item) return;
          if (item.status === "approved") {
            item.approved_against = approvalEvidence(
              step,
              item.approved_against?.approved_at,
              item.approved_against?.carried_from_plan_signature
            );
          } else {
            delete item.approved_against;
          }
        });
        feedback.review_status = "submitted";
      }
      feedback.updated_at = new Date().toISOString();
      const res = await fetch(apiPath("feedback"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(feedback, null, 2)
      });
      if (!res.ok) throw new Error("save failed");
      showToast(submitted ? "Submitted" : "Saved");
    }

    let saveTimer;
    function saveDebounced() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => save(false).catch(() => showToast("Save failed")), 250);
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    $("prevBtn").addEventListener("click", () => go(current - 1));
    $("nextBtn").addEventListener("click", async () => {
      if (current === steps.length - 1) {
        await save(true).catch(() => showToast("Submit failed"));
        render();
      } else {
        go(current + 1);
      }
    });

    window.go = go;
    window.setStatus = setStatus;
    init().catch((error) => {
      $("content").innerHTML = `<h1>리뷰 UI를 불러오지 못했습니다.</h1><p>${esc(error.message)}</p>`;
    });
  </script>
</body>
</html>
