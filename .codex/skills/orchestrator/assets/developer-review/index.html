<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발자 리뷰</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #57606a;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --line: #d0d7de;
      --line-soft: #eaeef2;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --success: #1a7f37;
      --warn: #9a6700;
      --danger: #cf222e;
      --shadow: 0 1px 3px rgba(31, 35, 40, 0.04), 0 8px 24px rgba(31, 35, 40, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 340px;
      min-height: 100vh;
    }

    .sidebar, .review-rail {
      background: var(--panel);
      border-color: var(--line);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sidebar { border-right: 1px solid var(--line); }
    .review-rail { border-left: 1px solid var(--line); }

    .sb-header, .review-header {
      padding: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .sb-kicker, .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sb-task {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .sb-meta, .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .sb-meta {
      display: grid;
      gap: 3px;
      margin-top: 8px;
    }

    .sb-section-label {
      padding: 14px 16px 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .steps {
      flex: 1;
      overflow: auto;
      padding: 0 8px 8px;
    }

    .step-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
      text-align: left;
    }

    .step-button:hover { background: var(--line-soft); }
    .step-button.active {
      background: var(--accent-soft);
      border-color: rgba(9, 105, 218, 0.3);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--line);
      margin-top: 5px;
    }

    .step-button[data-status="approved"] .status-dot { background: var(--success); }
    .step-button[data-status="needs-change"] .status-dot { background: var(--danger); }
    .step-button[data-status="question"] .status-dot { background: var(--warn); }
    .step-button[data-status="out-of-scope"] .status-dot { background: var(--muted); }

    .step-main { min-width: 0; }
    .step-title {
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .step-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }
    .step-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .badge, .pill, .history-pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--muted);
      background: var(--bg);
    }

    .badge.evidence { color: var(--accent); background: var(--accent-soft); border-color: rgba(9, 105, 218, 0.3); }
    .badge.topology { color: var(--success); background: rgba(26, 127, 55, 0.08); border-color: rgba(26, 127, 55, 0.25); }
    .badge.status-needs-change, .history-pill.status-needs-change { color: var(--danger); background: rgba(207, 34, 46, 0.08); border-color: rgba(207, 34, 46, 0.25); }
    .badge.status-question, .history-pill.status-question { color: var(--warn); background: rgba(154, 103, 0, 0.08); border-color: rgba(154, 103, 0, 0.25); }
    .badge.status-approved, .history-pill.status-approved, .history-pill.resolution-resolved { color: var(--success); background: rgba(26, 127, 55, 0.08); border-color: rgba(26, 127, 55, 0.25); }

    .sb-history {
      border-top: 1px solid var(--line-soft);
      padding: 10px 16px;
      max-height: 28vh;
      overflow: auto;
    }
    .sb-history summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      list-style: none;
    }
    .sb-history summary::-webkit-details-marker { display: none; }
    .sb-history-list { display: grid; gap: 8px; margin-top: 8px; }
    .sb-history-round { border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg); padding: 7px 8px; font-size: 12px; }
    .sb-history-round-meta { color: var(--muted); font-size: 11px; }

    .sb-submit-area {
      border-top: 1px solid var(--line-soft);
      padding: 12px 16px;
      display: grid;
      gap: 8px;
    }

    .submit, .status-row button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .submit {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .submit:disabled { background: #94a3b0; border-color: #94a3b0; cursor: not-allowed; }
    .submit-hint { color: var(--muted); font-size: 11px; line-height: 1.45; }

    main.main {
      width: 100%;
      max-width: 1180px;
      min-width: 0;
      margin: 0 auto;
      padding: 24px 28px 80px;
    }

    .content-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .content-header {
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 22px; line-height: 1.35; }
    h2 { font-size: 16px; line-height: 1.35; }
    h3 { font-size: 13px; line-height: 1.35; margin-bottom: 8px; }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .review-section {
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #fff;
      padding: 14px;
      min-width: 0;
    }
    .wide { grid-column: 1 / -1; }

    .list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .list li {
      padding: 8px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      line-height: 1.45;
    }

    .flow {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .flow span {
      display: block;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      padding: 8px 10px;
      line-height: 1.45;
    }
    .flow .arrow { display: none; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.45;
    }
    .data-table th,
    .data-table td {
      border-bottom: 1px solid var(--line-soft);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    .data-table th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

    .preview {
      border: 1px solid var(--line-soft);
      background: var(--bg);
      border-radius: 6px;
      padding: 12px;
    }
    .preview img {
      display: block;
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--line);
      margin-top: 10px;
    }

    .evidence-list { display: grid; gap: 14px; }
    .evidence-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 12px;
    }
    .evidence-frame {
      width: 100%;
      min-height: 460px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      margin-top: 12px;
    }

    .phase-owner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 12px;
    }
    .phase-owner-label {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 10px;
    }

    .history-list { display: grid; gap: 10px; }
    .history-entry {
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--bg);
      padding: 12px;
    }
    .history-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .history-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
    .history-row + .history-row { margin-top: 10px; }
    .history-row strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .history-row p { margin: 0; line-height: 1.55; }
    .history-row ul { margin: 0; padding-left: 18px; line-height: 1.55; }

    .finding { border-left: 3px solid var(--warn); padding-left: 10px; }

    .review-rail { padding: 0; }
    .review-box {
      padding: 16px;
      overflow: auto;
      display: grid;
      gap: 12px;
    }
    .review-target-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }
    .status-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .status-row button {
      text-align: left;
    }
    .status-row button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      padding: 10px;
      font: inherit;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      padding: 10px 12px;
      background: var(--ink);
      color: white;
      border-radius: 6px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 280px minmax(0, 1fr); }
      .review-rail {
        grid-column: 1 / -1;
        position: static;
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .review-box { max-width: 760px; }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .steps { max-height: 42vh; }
      main.main { padding: 16px; }
      .section-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-header">
        <div class="sb-kicker">개발자 리뷰</div>
        <div class="sb-task" id="navTitle">계획 리뷰</div>
        <div class="sb-meta" id="navMeta"></div>
      </div>
      <div class="sb-section-label">검토 대상</div>
      <div class="steps" id="steps"></div>
      <details class="sb-history" id="sidebarHistory" style="display:none">
        <summary>이력</summary>
        <div class="sb-history-list" id="sidebarHistoryList"></div>
      </details>
      <div class="sb-submit-area">
        <div class="submit-hint" id="submitHint"></div>
        <button class="submit" id="submitBtn">리뷰 제출</button>
      </div>
    </aside>
    <main class="main">
      <section class="content-panel" id="content"></section>
    </main>
    <aside class="review-rail">
      <div class="review-header">
        <div class="section-label">선택한 대상</div>
      </div>
      <section class="review-box" id="reviewBox"></section>
    </aside>
  </div>
  <div class="toast" id="toast">저장됨</div>

  <script>
    const statuses = [
      ["approved", "승인"],
      ["needs-change", "수정 필요"],
      ["question", "질문"],
      ["out-of-scope", "범위 외"]
    ];

    let model;
    let feedback;
    let reviewHistory;
    let steps = [];
    let current = 0;

    const $ = (id) => document.getElementById(id);

    function asArray(value) {
      if (!value) return [];
      return Array.isArray(value) ? value : [value];
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function canonicalize(value) {
      if (Array.isArray(value)) {
        return value.map(canonicalize);
      }
      if (value && typeof value === "object") {
        const ignored = new Set(["review_item_signature", "signature"]);
        return Object.keys(value)
          .filter((key) => !ignored.has(key) && value[key] !== undefined)
          .sort()
          .reduce((result, key) => {
            result[key] = canonicalize(value[key]);
            return result;
          }, {});
      }
      return value ?? null;
    }

    function hashString(value) {
      let h1 = 0xdeadbeef ^ value.length;
      let h2 = 0x41c6ce57 ^ value.length;
      for (let i = 0; i < value.length; i += 1) {
        const ch = value.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return `rvw-${(h2 >>> 0).toString(16).padStart(8, "0")}${(h1 >>> 0).toString(16).padStart(8, "0")}`;
    }

    function reviewGlobalContext(value) {
      const overview = value?.overview || {};
      return {
        task_slug: value?.task_slug || "",
        title: value?.title || "",
        review_outcome: value?.review_outcome || "",
        review_findings: asArray(value?.review_findings),
        overview_scope: {
          user_request: asArray(overview.user_request),
          included_scope: asArray(overview.included_scope),
          excluded_scope: asArray(overview.excluded_scope),
          change_shape: overview.change_shape || "",
          change_flow: asArray(overview.change_flow),
          major_changes: asArray(overview.major_changes),
          topology_contract: asArray(value?.topology_contract),
          evidence_artifacts: asArray(value?.evidence_artifacts)
        }
      };
    }

    function overviewSignaturePayload(value) {
      const overview = value?.overview || {};
      return {
        kind: "overview",
        id: "overview",
        title: value?.title || "",
        review_outcome: value?.review_outcome || "",
        review_findings: asArray(value?.review_findings),
        overview: {
          user_request: asArray(overview.user_request),
          understanding: overview.understanding || "",
          included_scope: asArray(overview.included_scope),
          excluded_scope: asArray(overview.excluded_scope),
          change_shape: overview.change_shape || "",
          change_flow: asArray(overview.change_flow),
          major_changes: asArray(overview.major_changes),
          risks: asArray(overview.risks),
          ui_previews: asArray(overview.ui_previews),
          topology_contract: asArray(overview.topology_contract),
          evidence_artifacts: asArray(overview.evidence_artifacts)
        }
      };
    }

    function phaseSignaturePayload(value, phase, index) {
      return {
        kind: "phase",
        id: phase?.id || `P${index + 1}`,
        global_context: reviewGlobalContext(value),
        phase: {
          id: phase?.id || `P${index + 1}`,
          title: phase?.title || "",
          owner_agent: phase?.owner_agent || "",
          goal: phase?.goal || "",
          changes: asArray(phase?.changes),
          contracts: asArray(phase?.contracts),
          file_impacts: asArray(phase?.file_impacts),
          validation: asArray(phase?.validation),
          risks: asArray(phase?.risks),
          ui_previews: asArray(phase?.ui_previews),
          topology_contract: asArray(phase?.topology_contract),
          evidence_artifacts: asArray(phase?.evidence_artifacts)
        }
      };
    }

    function reviewItemSignatureFromPayload(payload) {
      return hashString(JSON.stringify(canonicalize(payload)));
    }

    function attachReviewItemSignatures(value) {
      if (!value || typeof value !== "object") return value;
      if (value.overview && typeof value.overview === "object" && !value.overview.review_item_signature) {
        value.overview.review_item_signature = reviewItemSignatureFromPayload(overviewSignaturePayload(value));
      }
      asArray(value.phases).forEach((phase, index) => {
        if (phase && typeof phase === "object" && !phase.review_item_signature) {
          phase.review_item_signature = reviewItemSignatureFromPayload(phaseSignaturePayload(value, phase, index));
        }
      });
      return value;
    }

    function reviewItemSignature(step) {
      return step?.review_item_signature || "";
    }

    function approvalEvidence(step, approvedAt = null, carriedFromPlanSignature = null) {
      const carriedFrom = carriedFromPlanSignature && carriedFromPlanSignature !== model.plan_signature
        ? carriedFromPlanSignature
        : null;
      return {
        plan_signature: model.plan_signature,
        review_item_signature: reviewItemSignature(step),
        approved_at: approvedAt || new Date().toISOString(),
        carried_from_plan_signature: carriedFrom
      };
    }

    function isFreshApproval(item, step) {
      return item?.status === "approved" &&
        Boolean(reviewItemSignature(step)) &&
        item?.approved_against?.review_item_signature === reviewItemSignature(step);
    }

    function markEdited() {
      if (feedback.review_status === "submitted") {
        feedback.review_status = "in_progress";
      }
    }

    function list(items) {
      const normalized = asArray(items).filter(Boolean);
      if (!normalized.length) return "<p class=\"meta\">없음</p>";
      return `<ul class="list">${normalized.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
    }

    function flow(items) {
      const normalized = asArray(items).filter(Boolean);
      if (!normalized.length) return "";
      return `<div class="flow">${normalized.map((item, index) => `${index ? "<b class=\"arrow\">→</b>" : ""}<span>${esc(item)}</span>`).join("")}</div>`;
    }

    function previewBlock(previews) {
      const items = asArray(previews).filter(Boolean);
      if (!items.length) return "";
      return items.map((preview) => `
        <div class="preview">
          <strong>${esc(preview.id || "UI")}. ${esc(preview.title || "UI preview")}</strong>
          <p>${esc(preview.description || "화면이 어떤 식으로 나타날지 보여주는 계획 preview입니다.")}</p>
          ${preview.asset ? `<img src="${esc(preview.asset)}" alt="${esc(preview.title || "UI preview")}">` : ""}
        </div>
      `).join("");
    }

    function topologyTable(items) {
      const rows = asArray(items).filter(Boolean);
      if (!rows.length) return "";
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>경로</th>
              <th>상태</th>
              <th>종류</th>
              <th>Phase</th>
              <th>책임</th>
              <th>근거</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((item) => `
              <tr>
                <td><code>${esc(item.path || "")}</code></td>
                <td>${item.status ? `<span class="pill">${esc(item.status)}</span>` : ""}</td>
                <td>${esc(item.kind || "")}</td>
                <td>${esc(item.phase || "")}</td>
                <td>${esc(item.responsibility || "")}</td>
                <td>${esc(item.evidence || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function evidenceBlock(items) {
      const artifacts = asArray(items).filter(Boolean);
      if (!artifacts.length) return "";
      return `
        <div class="evidence-list">
          ${artifacts.map((item) => {
            const src = item.asset || item.entry || "";
            const canFrame = /\.html?$/i.test(src);
            return `
              <article class="evidence-item">
                <div class="history-pills">
                  <span class="history-pill">${esc(item.id || "evidence")}</span>
                  ${item.kind ? `<span class="history-pill">${esc(item.kind)}</span>` : ""}
                  ${item.phase ? `<span class="history-pill">${esc(item.phase)}</span>` : ""}
                </div>
                <p><strong>${esc(item.purpose || "체험 산출물")}</strong></p>
                ${asArray(item.review_points).length ? list(item.review_points) : ""}
                ${item.entry ? `<p class="meta">source: <code>${esc(item.entry)}</code>${item.content_hash ? ` · hash: <code>${esc(item.content_hash)}</code>` : ""}</p>` : ""}
                ${src ? `
                  ${canFrame
                    ? `<iframe class="evidence-frame" sandbox="allow-scripts" src="${esc(src)}" title="${esc(item.id || "evidence")}"></iframe>`
                    : `<p><a href="${esc(src)}" target="_blank" rel="noopener">Open evidence asset</a></p>`}
                ` : ""}
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function cssToken(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
    }

    function historyLabel(value) {
      return {
        approved: "승인",
        "needs-change": "수정 필요",
        question: "질문",
        "out-of-scope": "범위 외",
        answer_only: "답변만 필요",
        request_lock: "요청 재잠금",
        scope_decision: "범위 결정",
        ui_direction: "UI 방향",
        plan_revision: "계획 수정",
        resolved: "해결됨",
        active: "진행 중",
        superseded: "대체됨",
        "not reviewed": "미검토"
      }[value] || value;
    }

    function createHistoryFallback() {
      return {
        schema_version: 1,
        task_slug: model?.task_slug || "",
        current_plan_signature: model?.plan_signature || "",
        rounds: []
      };
    }

    function historyRounds() {
      return asArray(reviewHistory?.rounds).filter((round) => round && typeof round === "object");
    }

    function normalizedHistoryEntries(stepId) {
      const entries = [];
      historyRounds().forEach((round, roundIndex) => {
        asArray(round.items).forEach((item) => {
          if (!item || typeof item !== "object") return;
          if (stepId && item.step_id !== stepId) return;
          entries.push({
            roundId: round.id || `R${roundIndex + 1}`,
            stepId: item.step_id || "",
            stepLabel: item.step_label || item.step_id || "",
            submittedAt: round.submitted_at || round.updated_at || "",
            sourcePlanSignature: round.source_plan_signature || round.plan_signature || "",
            resultingPlanSignature: item.resulting_plan_signature || round.resulting_plan_signature || "",
            resolutionState: item.resolution_state || round.resolution_state || "",
            summary: item.resolution_summary || round.summary || "",
            userStatus: item.user_status || "",
            userComment: item.user_comment || "",
            triageRoute: item.triage_route || round.triage_route || "",
            actionSummary: asArray(item.action_summary).filter(Boolean)
          });
        });
      });
      return entries;
    }

    function renderHistoryEntries(entries, options = {}) {
      const { emptyText = "아직 기록된 리뷰 이력이 없습니다.", showStepLabel = false } = options;
      if (!entries.length) return `<p class="meta">${esc(emptyText)}</p>`;
      return `
        <div class="history-list">
          ${entries.map((entry) => `
            <article class="history-entry">
              <div class="history-meta">
                Round ${esc(entry.roundId)}
                ${entry.submittedAt ? ` · ${esc(entry.submittedAt)}` : ""}
                ${entry.sourcePlanSignature ? ` · from ${esc(entry.sourcePlanSignature)}` : ""}
                ${entry.resultingPlanSignature ? ` · to ${esc(entry.resultingPlanSignature)}` : ""}
              </div>
              <div class="history-pills">
                ${entry.userStatus ? `<span class="history-pill status-${cssToken(entry.userStatus)}">${esc(historyLabel(entry.userStatus))}</span>` : ""}
                ${entry.triageRoute ? `<span class="history-pill route-${cssToken(entry.triageRoute)}">${esc(historyLabel(entry.triageRoute))}</span>` : ""}
                ${entry.resolutionState ? `<span class="history-pill resolution-${cssToken(entry.resolutionState)}">${esc(historyLabel(entry.resolutionState))}</span>` : ""}
              </div>
              ${showStepLabel && entry.stepLabel ? `
                <div class="history-row">
                  <strong>대상 step</strong>
                  <p>${esc(entry.stepLabel)}</p>
                </div>
              ` : ""}
              <div class="history-row">
                <strong>사용자 리뷰</strong>
                <p>${esc(entry.userComment || "코멘트 없음")}</p>
              </div>
              ${entry.actionSummary.length ? `
                <div class="history-row">
                  <strong>조치</strong>
                  <ul>${entry.actionSummary.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
                </div>
              ` : ""}
              ${entry.summary ? `
                <div class="history-row">
                  <strong>결과</strong>
                  <p>${esc(entry.summary)}</p>
                </div>
              ` : ""}
            </article>
          `).join("")}
        </div>
      `;
    }

    async function loadJson(path, fallback) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) return fallback;
      return res.json();
    }

    function taskSlugFromUrl() {
      const match = window.location.pathname.match(/^\/review\/([A-Za-z0-9_-]+)$/);
      return match ? match[1] : "";
    }

    function apiPath(resource) {
      const taskSlug = taskSlugFromUrl();
      if (!taskSlug) return "";
      return `/api/reviews/${taskSlug}/${resource}`;
    }

    function normalizePreviewAssets(value) {
      const taskSlug = taskSlugFromUrl();
      if (!taskSlug || !value) return value;

      const normalizeOne = (item) => {
        if (!item || typeof item !== "object" || typeof item.asset !== "string") {
          return item;
        }
        if (/^(?:https?:)?\/\//.test(item.asset) || item.asset.startsWith("/")) {
          return item;
        }
        const asset = item.asset.replace(/^assets\//, "");
        return { ...item, asset: `/review-assets/${taskSlug}/${asset}` };
      };

      const normalizeContainer = (container) => {
        if (!container || typeof container !== "object") return;
        if (Array.isArray(container.ui_previews)) {
          container.ui_previews = container.ui_previews.map(normalizeOne);
        }
        if (Array.isArray(container.evidence_artifacts)) {
          container.evidence_artifacts = container.evidence_artifacts.map(normalizeOne);
        }
      };

      normalizeContainer(value.overview);
      asArray(value.phases).forEach(normalizeContainer);
      if (Array.isArray(value.evidence_artifacts)) {
        value.evidence_artifacts = value.evidence_artifacts.map(normalizeOne);
      }
      return value;
    }

    async function init() {
      const reviewDataPath = apiPath("review-data");
      if (!reviewDataPath) {
        $("content").innerHTML = "<h1>Invalid review URL.</h1>";
        return;
      }

      model = await loadJson(reviewDataPath, null);
      if (!model) {
        $("content").innerHTML = "<h1>review-data.json을 찾을 수 없습니다.</h1>";
        return;
      }
      attachReviewItemSignatures(model);
      model = normalizePreviewAssets(model);

      reviewHistory = await loadJson(apiPath("review-history"), createHistoryFallback());
      const existing = await loadJson(apiPath("feedback"), null);

      steps = [
        {
          id: "overview",
          label: "개요",
          kind: "overview",
          review_item_signature: model.overview?.review_item_signature || ""
        },
        ...asArray(model.phases).map((phase, index) => ({
          id: phase.id || `P${index + 1}`,
          label: phase.title || `단계 ${index + 1}`,
          kind: "phase",
          review_item_signature: phase.review_item_signature || "",
          phase
        })),
        {
          id: "final",
          label: "제출",
          kind: "final",
          review_item_signature: `final-${model.plan_signature || ""}`
        }
      ];

      feedback = createFeedback();
      mergeExistingFeedback(existing);
      ensureStepFeedback();
      render();
    }

    function createFeedback() {
      return {
        schema_version: 1,
        task_slug: model.task_slug,
        plan_signature: model.plan_signature,
        review_status: "in_progress",
        updated_at: new Date().toISOString(),
        steps: {},
        cards: {}
      };
    }

    function mergeExistingFeedback(existing) {
      if (!existing || typeof existing !== "object") return;
      if (existing.task_slug && existing.task_slug !== model.task_slug) return;

      const samePlan = existing.plan_signature === model.plan_signature;
      if (samePlan && existing.review_status === "submitted") {
        feedback.review_status = "submitted";
      }

      steps.forEach((step) => {
        const prior = existing.steps?.[step.id];
        if (!prior || typeof prior !== "object") return;

        const next = {
          status: typeof prior.status === "string" ? prior.status : "",
          comment: typeof prior.comment === "string" ? prior.comment : ""
        };

        if (samePlan) {
          if (next.status === "approved") {
            if (isFreshApproval(prior, step) || !prior.approved_against) {
              next.approved_against = approvalEvidence(
                step,
                prior.approved_against?.approved_at,
                prior.approved_against?.carried_from_plan_signature
              );
            } else {
              next.status = "";
              next.comment = "";
            }
          }
          feedback.steps[step.id] = next;
          return;
        }

        if (isFreshApproval(prior, step)) {
          const carriedFrom = prior.approved_against?.carried_from_plan_signature ||
            prior.approved_against?.plan_signature ||
            existing.plan_signature ||
            null;
          feedback.steps[step.id] = {
            status: "approved",
            comment: next.comment,
            approved_against: approvalEvidence(step, prior.approved_against?.approved_at, carriedFrom)
          };
        }
      });
    }

    function ensureStepFeedback() {
      if (!feedback.steps || typeof feedback.steps !== "object") {
        feedback.steps = {};
      }
      steps.forEach((step) => {
        if (!feedback.steps[step.id]) {
          feedback.steps[step.id] = { status: "", comment: "" };
        }
      });
    }

    function stepStatus(id) {
      return feedback.steps[id]?.status || "";
    }

    function currentStep() {
      return steps[current] || steps[0] || { id: "overview", label: "개요", kind: "overview" };
    }

    function stepKindLabel(step) {
      if (step.kind === "overview") return "개요";
      if (step.kind === "phase") return step.id || "단계";
      return "제출";
    }

    function targetTopology(step) {
      if (step.kind === "overview") {
        const overviewRows = asArray(model.overview?.topology_contract);
        return overviewRows.length ? overviewRows : asArray(model.topology_contract);
      }
      if (step.kind === "phase") return asArray(step.phase?.topology_contract);
      return [];
    }

    function targetEvidence(step) {
      if (step.kind === "overview") {
        const overviewItems = asArray(model.overview?.evidence_artifacts);
        return overviewItems.length ? overviewItems : asArray(model.evidence_artifacts);
      }
      if (step.kind === "phase") return asArray(step.phase?.evidence_artifacts);
      return [];
    }

    function render() {
      $("navTitle").textContent = model.title || model.task_slug || "계획 리뷰";
      $("navMeta").innerHTML = `
        <div>task: <strong>${esc(model.task_slug || "")}</strong></div>
        <div>signature: <strong>${esc(model.plan_signature || "")}</strong></div>
        <div>review: <strong>${esc(model.review_outcome || "")}</strong></div>
      `;
      renderSteps();
      renderSidebarHistory();
      renderContent();
      renderFeedbackBox();
      updateSubmitState();
    }

    function renderSteps() {
      $("steps").innerHTML = steps.map((step, index) => {
        const status = stepStatus(step.id);
        const topologyCount = targetTopology(step).length;
        const evidenceCount = targetEvidence(step).length;
        const badges = [
          status ? `<span class="badge status-${cssToken(status)}">${esc(historyLabel(status))}</span>` : "",
          topologyCount ? `<span class="badge topology">구조 ${topologyCount}</span>` : "",
          evidenceCount ? `<span class="badge evidence">산출물 ${evidenceCount}</span>` : ""
        ].filter(Boolean).join("");
        return `
          <button class="step-button ${index === current ? "active" : ""}" data-status="${esc(status)}" onclick="go(${index})">
            <span class="status-dot"></span>
            <span class="step-main">
              <span class="step-title">${esc(step.label)}</span>
              <span class="step-sub">${esc(stepKindLabel(step))}</span>
            </span>
            <span class="step-badges">${badges}</span>
          </button>
        `;
      }).join("");
    }

    function renderSidebarHistory() {
      const rounds = historyRounds();
      $("sidebarHistory").style.display = rounds.length ? "" : "none";
      $("sidebarHistoryList").innerHTML = rounds.map((round, index) => {
        const itemCount = asArray(round.items).length;
        return `
          <div class="sb-history-round">
            <div><strong>${esc(round.id || `R${index + 1}`)}</strong> ${round.resolution_state ? `<span class="badge">${esc(historyLabel(round.resolution_state))}</span>` : ""}</div>
            <div class="sb-history-round-meta">${esc(round.submitted_at || round.updated_at || "")}${itemCount ? ` · ${itemCount}개 항목` : ""}</div>
          </div>
        `;
      }).join("");
    }

    function renderContent() {
      const step = currentStep();
      if (step.kind === "overview") renderOverview();
      if (step.kind === "phase") renderPhase(step.phase, step.id);
      if (step.kind === "final") renderFinal();
    }

    function contentHeader(kind, title, meta, extra = "") {
      return `
        <div class="content-header">
          <div class="eyebrow">${esc(kind)}</div>
          <h1>${esc(title)}</h1>
          ${meta ? `<p class="meta">${esc(meta)}</p>` : ""}
          ${extra}
        </div>
      `;
    }

    function renderOverview() {
      const overview = model.overview || {};
      const history = normalizedHistoryEntries("overview");
      const step = currentStep();
      $("content").innerHTML = `
        ${contentHeader("개요", model.title || model.task_slug || "계획 리뷰", overview.understanding || "요청을 바탕으로 이해한 전체 방향을 검토합니다.")}
        <div class="section-grid">
          <article class="review-section"><h3>사용자 요청</h3>${list(overview.user_request)}</article>
          <article class="review-section"><h3>포함 범위</h3>${list(overview.included_scope)}</article>
          <article class="review-section"><h3>제외 범위</h3>${list(overview.excluded_scope)}</article>
          <article class="review-section"><h3>주요 변경점</h3>${list(overview.major_changes)}</article>
          <article class="review-section wide"><h3>변경 형상</h3><p>${esc(overview.change_shape || "")}</p>${flow(overview.change_flow)}</article>
          <article class="review-section wide"><h3>핵심 리스크</h3>${list(overview.risks)}</article>
          ${topologyTable(targetTopology(step)) ? `<article class="review-section wide"><h3>파일/폴더 구조 계약</h3>${topologyTable(targetTopology(step))}</article>` : ""}
          ${evidenceBlock(targetEvidence(step)) ? `<article class="review-section wide"><h3>체험 산출물</h3>${evidenceBlock(targetEvidence(step))}</article>` : ""}
          ${history.length ? `<article class="review-section wide"><h3>이전 리뷰와 조치</h3>${renderHistoryEntries(history, { emptyText: "이전 overview 리뷰 이력이 없습니다." })}</article>` : ""}
          ${previewBlock(overview.ui_previews) ? `<article class="review-section wide"><h3>UI 계획 preview</h3>${previewBlock(overview.ui_previews)}</article>` : ""}
        </div>
      `;
    }

    function renderPhase(phase, stepId) {
      const history = normalizedHistoryEntries(stepId);
      const step = currentStep();
      $("content").innerHTML = `
        ${contentHeader(stepId, phase.title || stepId, phase.goal || "이 단계의 목표와 실행 계약을 검토합니다.", phase.owner_agent ? `
          <div class="phase-owner">
            <span class="phase-owner-label">담당 agent</span>
            <strong>${esc(phase.owner_agent)}</strong>
          </div>
        ` : "")}
        <div class="section-grid">
          <article class="review-section"><h3>변경 내용</h3>${list(phase.changes)}</article>
          <article class="review-section"><h3>검증</h3>${list(phase.validation)}</article>
          <article class="review-section wide"><h3>계약</h3>${list(phase.contracts)}</article>
          <article class="review-section wide"><h3>파일 영향</h3>${list(phase.file_impacts)}</article>
          ${topologyTable(targetTopology(step)) ? `<article class="review-section wide"><h3>파일/폴더 구조 계약</h3>${topologyTable(targetTopology(step))}</article>` : ""}
          ${evidenceBlock(targetEvidence(step)) ? `<article class="review-section wide"><h3>체험 산출물</h3>${evidenceBlock(targetEvidence(step))}</article>` : ""}
          <article class="review-section wide"><h3>리스크 / 주의점</h3>${list(phase.risks)}</article>
          ${history.length ? `<article class="review-section wide"><h3>이전 리뷰와 조치</h3>${renderHistoryEntries(history, { emptyText: "이전 phase 리뷰 이력이 없습니다." })}</article>` : ""}
          ${previewBlock(phase.ui_previews) ? `<article class="review-section wide"><h3>UI 계획 preview</h3>${previewBlock(phase.ui_previews)}</article>` : ""}
        </div>
      `;
    }

    function renderFinal() {
      const findings = asArray(model.review_findings);
      const history = normalizedHistoryEntries("");
      const nextLabel = model.post_approval_next_label || "다음 단계: $plan-tdd";
      const nextSummary = model.post_approval_next_summary || "모든 step이 승인되면 production code 구현 전에 승인된 plan.md 기준으로 TDD 계약 테스트를 작성합니다.";
      const stepRows = steps.filter((step) => step.kind !== "final").map((step) => {
        const item = feedback.steps[step.id] || {};
        return `<li><strong>${esc(step.label)}</strong>: ${esc(historyLabel(item.status || "not reviewed"))} ${item.comment ? `- ${esc(item.comment)}` : ""}</li>`;
      }).join("");

      $("content").innerHTML = `
        ${contentHeader("제출", "리뷰 제출", "모든 대상의 승인/수정 요청을 확인한 뒤 제출합니다. 제출 후 채팅에 리뷰 완료라고 알려주세요.")}
        <div class="section-grid">
          <article class="review-section wide"><h3>대상 상태</h3><ul class="list">${stepRows}</ul></article>
          <article class="review-section wide"><h3>${esc(nextLabel)}</h3><p>${esc(nextSummary)}</p></article>
          <article class="review-section wide"><h3>계획 리뷰 지적 사항</h3>${findings.length ? findings.map((item) => `<p class="finding">${esc(item)}</p>`).join("") : "<p class=\"meta\">없음</p>"}</article>
          ${history.length ? `<article class="review-section wide"><h3>리뷰 이력과 조치 요약</h3>${renderHistoryEntries(history, { emptyText: "기록된 리뷰 이력이 없습니다.", showStepLabel: true })}</article>` : ""}
        </div>
      `;
    }

    function renderFeedbackBox() {
      const step = currentStep();
      const item = feedback.steps[step.id] || { status: "", comment: "" };
      const topologyCount = targetTopology(step).length;
      const evidenceCount = targetEvidence(step).length;
      $("reviewBox").innerHTML = `
        <div class="review-target-title">${esc(step.label)}</div>
        <p class="meta">현재 선택한 검토 대상에 대한 판단을 저장합니다.</p>
        <div class="history-pills">
          <span class="history-pill">${esc(stepKindLabel(step))}</span>
          ${topologyCount ? `<span class="history-pill">구조 ${topologyCount}</span>` : ""}
          ${evidenceCount ? `<span class="history-pill">산출물 ${evidenceCount}</span>` : ""}
          ${reviewItemSignature(step) ? `<span class="history-pill">서명됨</span>` : ""}
        </div>
        <div class="status-row">
          ${statuses.map(([value, label]) => `<button class="${item.status === value ? "active" : ""}" onclick="setStatus('${value}')">${label}</button>`).join("")}
        </div>
        <textarea id="comment" placeholder="수정 요청이나 질문을 적어주세요.">${esc(item.comment || "")}</textarea>
        ${feedback.review_status === "submitted" ? `<p class="meta">이 리뷰는 제출된 상태입니다. 내용을 바꾸면 다시 진행 중 상태로 돌아갑니다.</p>` : ""}
      `;
      $("comment").addEventListener("input", (event) => {
        markEdited();
        feedback.steps[step.id].comment = event.target.value;
        saveDebounced();
      });
    }

    function updateSubmitState() {
      const reviewable = steps.filter((step) => step.kind !== "final");
      const unreviewed = reviewable.filter((step) => !stepStatus(step.id)).length;
      const nonApproved = reviewable.filter((step) => {
        const status = stepStatus(step.id);
        return status && status !== "approved";
      }).length;
      $("submitBtn").textContent = feedback.review_status === "submitted" ? "제출됨" : "리뷰 제출";
      $("submitHint").textContent = feedback.review_status === "submitted"
        ? "제출됨. 채팅에 리뷰 완료라고 알려주세요."
        : `${unreviewed}개 미검토, ${nonApproved}개 승인 외 상태`;
    }

    function setStatus(status) {
      const step = steps[current];
      markEdited();
      feedback.steps[step.id].status = status;
      if (status === "approved") {
        feedback.steps[step.id].approved_against = approvalEvidence(
          step,
          feedback.steps[step.id].approved_against?.approved_at,
          feedback.steps[step.id].approved_against?.carried_from_plan_signature
        );
      } else {
        delete feedback.steps[step.id].approved_against;
      }
      saveDebounced();
      render();
    }

    function scrollStepTop() {
      const content = $("content");
      if (content?.scrollIntoView) {
        content.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function go(index) {
      current = Math.max(0, Math.min(index, steps.length - 1));
      render();
      scrollStepTop();
    }

    async function save(submitted = false) {
      if (submitted) {
        steps.forEach((step) => {
          const item = feedback.steps[step.id];
          if (!item) return;
          if (item.status === "approved") {
            item.approved_against = approvalEvidence(
              step,
              item.approved_against?.approved_at,
              item.approved_against?.carried_from_plan_signature
            );
          } else {
            delete item.approved_against;
          }
        });
        feedback.review_status = "submitted";
      }
      feedback.updated_at = new Date().toISOString();
      const res = await fetch(apiPath("feedback"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(feedback, null, 2)
      });
      if (!res.ok) throw new Error("save failed");
      showToast(submitted ? "제출됨" : "저장됨");
    }

    let saveTimer;
    function saveDebounced() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => save(false).catch(() => showToast("저장 실패")), 250);
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    $("submitBtn").addEventListener("click", async () => {
      const unreviewed = steps.filter((step) => step.kind !== "final" && !stepStatus(step.id)).length;
      if (unreviewed && !window.confirm(`미검토 대상 ${unreviewed}개가 있습니다. 그래도 제출하시겠습니까?`)) {
        return;
      }
      await save(true).catch(() => showToast("제출 실패"));
      render();
    });

    window.go = go;
    window.setStatus = setStatus;
    init().catch((error) => {
      $("content").innerHTML = `<h1>리뷰 UI를 불러오지 못했습니다.</h1><p>${esc(error.message)}</p>`;
    });
  </script>
</body>
</html>
