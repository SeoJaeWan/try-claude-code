interface:
  display_name: "Plan Review"
  short_description: "Critically review executable plans for blockers, drift, and top-level bloat."
  default_prompt: "Use $plan-review to cold-review an architect-generated ./plans/.../plan.md and its linked phase detail files for blockers, topology mistakes, contract drift, plan.md/detail duplication, developer-review readiness, and later plan-materialize derivation risks before execution."
