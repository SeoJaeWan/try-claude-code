interface:
  display_name: "Shape"
  short_description: "Shape work and draft its Dev Wiki record"
  default_prompt: "Use $workbench:shape to produce an evidence-backed Shape Report and proposed Dev Wiki artifact without creating a worktree."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Search and read Local Work Memory project evidence"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"
    - type: "mcp"
      value: "context7"
      description: "Retrieve current version-aware technical documentation"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"
    - type: "mcp"
      value: "atlassian"
      description: "Read linked Jira issues and comments as project evidence"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp/authv2"
    - type: "mcp"
      value: "figma"
      description: "Inspect linked Figma designs as project evidence"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: false
