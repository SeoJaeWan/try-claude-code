interface:
  display_name: "Shape"
  short_description: "Investigate a change with sourced evidence"
  default_prompt: "Use $workbench:shape to investigate this software change and return a standalone evidence-backed report."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Read project conventions and canonical project documents"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"
    - type: "mcp"
      value: "context7"
      description: "Retrieve current version-aware technical documentation"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"
    - type: "mcp"
      value: "atlassian"
      description: "Read linked Jira evidence"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp/authv2"
    - type: "mcp"
      value: "figma"
      description: "Inspect linked Figma evidence"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: false
