interface:
  display_name: "Shape"
  short_description: "Investigate a change with sourced evidence"
  default_prompt: "Use $workbench:shape to investigate this software change and return a standalone evidence-backed report."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Inspect linked Figma evidence"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: false
