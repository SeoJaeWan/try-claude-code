interface:
  display_name: "Issue Brief"
  short_description: "Organize Jira, Figma, API, and user context"
  default_prompt: "Use $workbench:issue-brief to organize this Jira, Figma, API, and user-provided context without inventing an implementation plan."
dependencies:
  tools:
    - type: "mcp"
      value: "atlassian"
      description: "Atlassian MCP server for Jira issue fields and comments"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp/authv2"
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server for inspecting linked design evidence"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
    - type: "mcp"
      value: "openapi"
      description: "Local OpenAPI MCP server for searching registered Swagger/OpenAPI specs"
      transport: "stdio"
policy:
  allow_implicit_invocation: false
