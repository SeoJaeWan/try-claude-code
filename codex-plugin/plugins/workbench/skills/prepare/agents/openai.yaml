interface:
  display_name: "Prepare"
  short_description: "Prepare a standalone task-scoped execution plan"
  default_prompt: "Use $workbench:prepare to turn this complete Shape Report into a verified task-scoped worktree plan without persisting it."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Read project documents and resolve supplied Workbench artifact references"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"

policy:
  allow_implicit_invocation: false
