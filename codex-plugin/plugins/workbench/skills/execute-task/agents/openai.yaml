interface:
  display_name: "Execute Task"
  short_description: "Execute one task in its assigned worktree"
  default_prompt: "Use $workbench:execute-task to implement and verify this prepared task in its assigned worktree."

dependencies:
  tools:
    - type: "mcp"
      value: "context7"
      description: "Verify version-aware library details discovered during implementation"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"

policy:
  allow_implicit_invocation: false
