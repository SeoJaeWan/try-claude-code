interface:
  display_name: "Finalize"
  short_description: "Review and validate one integrated Git change"
  default_prompt: "Use $workbench:finalize to validate this selected integrated Git change and report the result."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Resolve user-provided supporting artifact references"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"

policy:
  allow_implicit_invocation: false
