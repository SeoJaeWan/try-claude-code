interface:
  display_name: "Memory Update"
  short_description: "Persist one completed work artifact safely"
  default_prompt: "Use $workbench:memory-update to persist this selected completed work artifact."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Commit one selected completed work artifact"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"

policy:
  allow_implicit_invocation: false
