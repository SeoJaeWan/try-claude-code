interface:
  display_name: "Memory Update"
  short_description: "Optionally persist one Workbench artifact"
  default_prompt: "Use $workbench:memory-update to persist this completed Shape or Prepare result as an immutable Workbench artifact."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Commit a selected Shape or Prepare result as an immutable Workbench artifact"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"

policy:
  allow_implicit_invocation: false
