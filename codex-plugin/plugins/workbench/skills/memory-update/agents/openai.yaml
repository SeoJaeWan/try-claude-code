interface:
  display_name: "Memory Update"
  short_description: "Persist one Shape or Prepare Wiki artifact"
  default_prompt: "Use $workbench:memory-update to persist this completed Shape or Prepare artifact to its canonical Dev Wiki page."

dependencies:
  tools:
    - type: "mcp"
      value: "local-work-memory"
      description: "Apply guarded Dev Wiki artifact mutations to Local Work Memory"
      transport: "streamable_http"
      url: "https://mcp.seojaewan.com/mcp/memory"

policy:
  allow_implicit_invocation: false
