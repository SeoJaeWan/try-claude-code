interface:
  display_name: "OpenAPI"
  short_description: "Register and search Swagger specs."
  default_prompt: "Use $openapi to register Swagger services or find candidate APIs."
dependencies:
  tools:
    - type: "mcp"
      value: "openapi"
      description: "Local OpenAPI MCP server for registering and searching Swagger/OpenAPI specs"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
