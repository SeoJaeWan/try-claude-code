name: plugin-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: hook contract (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run hook contract tests
        run: npm test

      - name: Smoke test plan-copy helper
        shell: bash
        run: |
          set -e
          tmpdir="${RUNNER_TEMP:-/tmp}/plan-copy-ci"
          rm -rf "$tmpdir"
          mkdir -p "$tmpdir/src/phases"
          echo "plan" > "$tmpdir/src/plan.md"
          echo "phase" > "$tmpdir/src/phases/01-foo.md"
          node plugin/develop/scripts/plan-copy.mjs "$tmpdir/src" "$tmpdir/dst"
          test -f "$tmpdir/dst/plan.md"
          test -f "$tmpdir/dst/phases/01-foo.md"

      - name: Smoke test SessionStart Codex probe (no Codex expected)
        shell: bash
        run: |
          set -e
          out=$(echo '{"session_id":"ci-probe","cwd":"."}' \
            | node plugin/develop/scripts/session-lifecycle-hook.mjs session-start 2>&1)
          echo "$out"
          echo "$out" | grep -q "Codex" || (echo "probe did not announce Codex status" && exit 1)
