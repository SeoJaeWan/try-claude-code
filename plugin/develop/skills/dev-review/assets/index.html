<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Review</title>
  <link rel="stylesheet" href="vendor/diff2html.min.css">
  <link rel="stylesheet" href="vendor/highlight-theme.css">
  <style>
    :root {
      --ink: #1f2328;
      --muted: #57606a;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --line: #d0d7de;
      --line-soft: #eaeef2;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --success: #1a7f37;
      --warn: #9a6700;
      --danger: #cf222e;
      --shadow: 0 1px 3px rgba(31, 35, 40, 0.04), 0 8px 24px rgba(31, 35, 40, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100vh; }

    /* Sidebar */
    aside.sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .sb-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line-soft); }
    .sb-task { font-weight: 700; font-size: 15px; word-break: break-all; }
    .sb-meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sb-round-badge { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; }

    .sb-section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 6px; }

    .sb-commits { flex: 1; overflow: auto; padding: 0 8px 8px; }
    .sb-commit { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; border: 1px solid transparent; }
    .sb-commit:hover { background: var(--line-soft); }
    .sb-commit.active { background: var(--accent-soft); border-color: rgba(9, 105, 218, 0.3); }
    .sb-commit-checkbox { margin-top: 3px; cursor: pointer; }
    .sb-commit-body { min-width: 0; }
    .sb-commit-sha { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
    .sb-commit-subject { font-size: 13px; line-height: 1.35; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
    .sb-commit-badges { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; flex-shrink: 0; }
    .sb-badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px; line-height: 1.4; white-space: nowrap; }
    .sb-badge.needs-change { background: rgba(207, 34, 46, 0.1); color: var(--danger); }
    .sb-badge.question { background: rgba(154, 103, 0, 0.1); color: var(--warn); }
    .sb-badge.out-of-scope { background: rgba(87, 96, 106, 0.1); color: var(--muted); }
    .sb-badge.viewed { background: rgba(26, 127, 55, 0.1); color: var(--success); }

    .sb-history { border-top: 1px solid var(--line-soft); padding: 10px 16px; }
    .sb-history summary { cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); list-style: none; }
    .sb-history summary::-webkit-details-marker { display: none; }
    .sb-history-list { margin-top: 8px; display: grid; gap: 8px; }
    .sb-history-round { font-size: 12px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px; }
    .sb-history-round > summary { cursor: pointer; list-style: none; }
    .sb-history-round > summary::-webkit-details-marker { display: none; }
    .sb-history-round-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .sb-history-empty { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .sb-history-comment { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-soft); }
    .sb-hc-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sb-hc-head code { font-size: 10.5px; color: var(--muted); }
    .sb-hc-body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
    .sb-hc-response { margin-top: 5px; padding: 5px 7px; background: var(--accent-soft); border-radius: 5px; }
    .sb-hc-route { font-weight: 700; font-size: 11px; color: var(--accent); }
    .sb-hc-summary { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }

    .sb-submit-area { border-top: 1px solid var(--line-soft); padding: 12px 16px; display: grid; gap: 8px; }
    .btn-submit { background: var(--success); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-submit:hover:not(:disabled) { filter: brightness(0.95); }
    .btn-submit:disabled { background: #94a3b0; cursor: not-allowed; }
    .btn-reopen { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-reopen:hover { background: var(--accent-soft); }
    .submit-hint { font-size: 11px; color: var(--muted); }

    /* Main panel */
    main.main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 28px 80px;
      width: 100%;
      min-width: 0;
      /* min-width: 0 on the grid item itself — sidebar uses grid auto sizing */
    }
    .app > main.main { min-width: 0; }
    .empty-main { color: var(--muted); padding: 40px 20px; text-align: center; }

    .commit-header { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; margin-bottom: 18px; }
    .commit-meta-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .commit-sha-pill { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); padding: 2px 8px; border-radius: 4px; font-size: 12px; color: var(--ink); }
    .commit-subject { font-size: 18px; font-weight: 600; margin: 8px 0 6px; line-height: 1.35; }
    .commit-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: var(--ink); background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px; padding: 10px 12px; margin-top: 10px; max-height: 6.5em; overflow: hidden; position: relative; }
    .commit-body.expanded { max-height: none; }
    .commit-body-toggle { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; }

    .verdict-toolbar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 16px; position: sticky; top: 8px; z-index: 5; }
    .verdict-toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
    .verdict-toolbar input[type="checkbox"] { cursor: pointer; }
    .toolbar-spacer { flex: 1; }
    .out-of-scope-banner { color: var(--muted); font-size: 12px; }

    .files-list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 16px; }
    .files-list-header { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
    .files-list-toggle { display: flex; gap: 4px; }
    .toggle-btn { background: var(--bg); border: 1px solid var(--line); padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; color: var(--muted); }
    .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .files-list ul { margin: 0; padding: 0; list-style: none; }
    .files-list li { padding: 7px 14px; border-top: 1px solid var(--line-soft); font-size: 12.5px; cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
    .files-list li:first-child { border-top: none; }
    .files-list li:hover { background: var(--line-soft); }
    .file-path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; word-break: break-all; }
    .file-kind { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
    .file-kind.added { color: var(--success); border-color: rgba(26, 127, 55, 0.4); background: rgba(26, 127, 55, 0.06); }
    .file-kind.deleted { color: var(--danger); border-color: rgba(207, 34, 46, 0.4); background: rgba(207, 34, 46, 0.06); }
    .file-kind.renamed { color: var(--accent); border-color: rgba(9, 105, 218, 0.4); background: rgba(9, 105, 218, 0.06); }
    .file-stats { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
    .file-stats .add { color: var(--success); }
    .file-stats .del { color: var(--danger); }

    .diff-area { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .diff-area.dimmed { opacity: 0.55; }
    /* Width containment for diff tables — vendor CSS ships no overflow-x on
       .d2h-file-diff and long pre-formatted lines otherwise blow past the
       1200px main column. Wrap each file box and let it scroll horizontally. */
    .diff-area .d2h-file-wrapper { overflow: hidden; max-width: 100%; min-width: 0; }
    .diff-area .d2h-file-diff { overflow-x: auto; }
    .diff-area .d2h-files-diff { max-width: 100%; }
    .diff-area .d2h-file-side-diff { min-width: 0; }

    /* Inline comment widget — injected as a <tr> inside the diff table */
    .comment-thread { background: var(--panel); }
    .comment-thread > td { padding: 0 !important; }
    .comment-thread-inner { margin: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fdfdfd; }
    .comment-thread-inner .comment { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
    .comment-thread-inner .comment:last-child { border-bottom: none; }
    .comment-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; margin-bottom: 4px; }
    .comment-type-badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
    .comment-type-badge.needs-change { background: rgba(207, 34, 46, 0.1); color: var(--danger); }
    .comment-type-badge.question { background: rgba(154, 103, 0, 0.1); color: var(--warn); }
    .comment-type-badge.out-of-scope { background: rgba(87, 96, 106, 0.1); color: var(--muted); }
    .comment-anchor { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; color: var(--muted); }
    .comment-actions { margin-left: auto; display: flex; gap: 4px; }
    .comment-actions button { background: none; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; padding: 2px 7px; cursor: pointer; color: var(--muted); }
    .comment-actions button:hover { color: var(--ink); border-color: var(--muted); }
    .comment-body { white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--ink); }
    .comment-agent { font-size: 11px; color: var(--accent); margin-top: 4px; }
    .comment-stale-warning { font-size: 11px; color: var(--danger); margin-top: 4px; }

    /* Add-comment hover indicator on diff gutter — CSS-only, no per-row DOM nodes */
    .d2h-code-side-linenumber, .d2h-code-linenumber { position: relative; user-select: none; }
    .diff-area:not(.submitted) tr:hover .d2h-code-linenumber[data-line]::before,
    .diff-area:not(.submitted) tr:hover .d2h-code-side-linenumber[data-line]::before {
      content: "+";
      position: absolute;
      right: -6px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 12px; line-height: 18px;
      text-align: center;
      font-weight: 700;
      z-index: 4;
      pointer-events: none;
    }
    tr.range-selected .d2h-code-side-linenumber, tr.range-selected .d2h-code-linenumber { background: rgba(9, 105, 218, 0.2) !important; }

    /* Comment popup overlay */
    .popup-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .popup { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 480px; max-width: 90vw; box-shadow: var(--shadow); }
    .popup h3 { margin: 0 0 6px; font-size: 14px; }
    .popup-anchor { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
    .popup-types { display: flex; gap: 10px; margin-bottom: 12px; }
    .popup-types label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; }
    .popup-types label.checked { background: var(--accent-soft); border-color: var(--accent); }
    .popup textarea { width: 100%; min-height: 80px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font: inherit; resize: vertical; font-size: 13px; }
    .popup-agent { margin-top: 12px; }
    .popup-agent label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .popup-agent select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 13px; }
    .popup-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
    .popup-actions button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; }
    .popup-actions .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .popup-actions .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .popup-error { color: var(--danger); font-size: 12px; margin-top: 8px; }

    /* Submitted banner */
    .submitted-banner { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
    .read-only-badge { font-size: 11px; color: var(--muted); margin-left: 6px; }

    /* Diff overrides — keep diff2html readable on light bg */
    .d2h-file-wrapper { border: 1px solid var(--line); border-radius: 6px; margin: 0; }
    .d2h-file-header { background: var(--bg); border-bottom: 1px solid var(--line); }
    .d2h-files-diff .d2h-file-side-diff:first-child { border-right: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-header">
        <div class="sb-task" id="sb-task">…</div>
        <div class="sb-meta" id="sb-meta"></div>
      </div>
      <div class="sb-section-label">Commits</div>
      <div class="sb-commits" id="sb-commits"></div>
      <details class="sb-history" id="sb-history" style="display:none">
        <summary>History</summary>
        <div class="sb-history-list" id="sb-history-list"></div>
      </details>
      <div class="sb-submit-area">
        <div class="submit-hint" id="submit-hint"></div>
        <button class="btn-submit" id="btn-submit" disabled>Submit review</button>
        <button class="btn-reopen" id="btn-reopen" style="display:none">Reopen for another round</button>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="empty-main">Loading…</div>
    </main>
  </div>

  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/diff2html-ui.min.js"></script>
  <script>
  (function () {
    "use strict";

    // ---------- API helpers ----------
    async function apiGet(path) {
      const r = await fetch(path, { cache: "no-store" });
      if (!r.ok) throw new Error(`GET ${path} → ${r.status}`);
      return r.json();
    }
    async function apiSend(method, path, body) {
      const r = await fetch(path, {
        method,
        headers: body ? { "content-type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store",
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `${method} ${path} → ${r.status}`);
      return data;
    }

    // ---------- State ----------
    const state = {
      model: null,
      feedback: null,
      history: null,
      activeSha: null,
      diffMode: localStorage.getItem("devreview.diffMode") || "unified",
      diffCache: new Map(),
      // Tracks what the main panel currently has drawn so feedback-only
      // changes (comments, viewed/oos toggles) skip the diff re-render.
      rendered: { sha: null, mode: null, status: null },
    };

    // ---------- Initial load ----------
    async function load() {
      try {
        state.model = await apiGet("review-data.json");
        state.feedback = await apiGet("feedback.json");
        try { state.history = await apiGet("review-history.json"); } catch { state.history = null; }
      } catch (err) {
        document.querySelector("#main").innerHTML =
          `<div class="empty-main"><strong>로드 실패:</strong> ${escapeHtml(err.message)}</div>`;
        return;
      }
      if (state.feedback && state.feedback.plan_signature && state.model.plan_signature &&
          state.feedback.plan_signature !== state.model.plan_signature) {
        document.querySelector("#main").innerHTML =
          `<div class="empty-main"><strong>plan_signature 불일치:</strong> 서버가 새 라운드를 생성했습니다. 페이지를 새로고침하세요.</div>`;
        return;
      }
      if (!state.feedback || !state.feedback.schema_version) {
        // Defensive: render empty state if feedback missing
        state.feedback = { comments: [], commit_status: {}, review_status: "in_progress" };
      }
      if (!Array.isArray(state.feedback.comments)) state.feedback.comments = [];
      if (!state.feedback.commit_status || typeof state.feedback.commit_status !== "object") {
        state.feedback.commit_status = {};
      }

      if (state.model.commits.length > 0) {
        state.activeSha = state.model.commits[0].sha;
      }
      renderAll();
    }

    function renderAll() {
      renderSidebar();
      renderMain();
      renderSubmit();
    }

    // ---------- Sidebar ----------
    function renderSidebar() {
      document.querySelector("#sb-task").textContent = state.model.task_slug;
      const meta = document.querySelector("#sb-meta");
      meta.innerHTML = "";
      const head = document.createElement("span");
      head.className = "sb-round-badge";
      const sha = typeof state.model.task_head_sha === "string"
        ? state.model.task_head_sha.slice(0, 7)
        : "—";
      head.textContent = `@${sha}`;
      meta.appendChild(head);
      const totals = document.createElement("span");
      const t = state.model.totals || {};
      totals.textContent = `${t.total_commits ?? 0} commits · ${t.total_files_changed ?? 0} files · +${t.additions ?? 0}/-${t.deletions ?? 0}`;
      meta.appendChild(totals);

      const list = document.querySelector("#sb-commits");
      list.innerHTML = "";
      for (const c of state.model.commits) {
        const stat = state.feedback.commit_status[c.sha] || { viewed: false, out_of_scope: false };
        const verdict = computeVerdict(c.sha);
        const row = document.createElement("div");
        row.className = "sb-commit" + (state.activeSha === c.sha ? " active" : "");
        row.dataset.sha = c.sha;

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "sb-commit-checkbox";
        cb.checked = !!stat.viewed;
        cb.title = "Mark viewed";
        cb.addEventListener("click", (e) => e.stopPropagation());
        cb.addEventListener("change", () => toggleViewed(c.sha, cb.checked));

        const body = document.createElement("div");
        body.className = "sb-commit-body";
        body.innerHTML =
          `<div class="sb-commit-sha">${escapeHtml(c.short_sha)}</div>` +
          `<div class="sb-commit-subject">${escapeHtml(c.message_subject)}</div>`;

        const badges = document.createElement("div");
        badges.className = "sb-commit-badges";
        const counts = countComments(c.sha);
        if (verdict === "out-of-scope") {
          badges.appendChild(makeBadge("out-of-scope", "out-of-scope"));
        } else if (counts.needsChange > 0) {
          badges.appendChild(makeBadge(`needs-change (${counts.needsChange})`, "needs-change"));
        } else if (counts.question > 0) {
          badges.appendChild(makeBadge(`question (${counts.question})`, "question"));
        } else if (stat.viewed) {
          badges.appendChild(makeBadge("✓ viewed", "viewed"));
        }

        row.appendChild(cb);
        row.appendChild(body);
        row.appendChild(badges);
        row.addEventListener("click", () => {
          state.activeSha = c.sha;
          renderAll();
        });
        list.appendChild(row);
      }

      // History
      const hist = document.querySelector("#sb-history");
      const histList = document.querySelector("#sb-history-list");
      if (state.history && Array.isArray(state.history.rounds) && state.history.rounds.length > 0) {
        hist.style.display = "";
        histList.innerHTML = "";
        // Newest round first so the most recent review+response is on top.
        for (const r of [...state.history.rounds].reverse()) {
          histList.appendChild(renderHistoryRound(r));
        }
      } else {
        hist.style.display = "none";
      }
    }

    // Render one past review round: header tally + each comment with the
    // response it received (route + summary + resulting commit). Read-only.
    function renderHistoryRound(r) {
      const comments = Array.isArray(r.comments_snapshot) ? r.comments_snapshot : [];
      const tally = comments.reduce((acc, c) => {
        acc[c.type] = (acc[c.type] || 0) + 1; return acc;
      }, {});
      const tallyText = Object.entries(tally).map(([k, v]) => `${k}:${v}`).join(" · ") || "no comments";

      const det = document.createElement("details");
      det.className = "sb-history-round";

      const summary = document.createElement("summary");
      summary.innerHTML =
        `<strong>${escapeHtml(r.id)}</strong> · ${escapeHtml(r.resolution_state || "")}` +
        `<div class="sb-history-round-meta">${escapeHtml((r.submitted_at || "").slice(0, 19).replace("T", " "))} · ${escapeHtml(tallyText)}</div>`;
      det.appendChild(summary);

      if (comments.length === 0) {
        const empty = document.createElement("div");
        empty.className = "sb-history-empty";
        empty.textContent = "이 라운드에는 코멘트가 없습니다 (전체 승인).";
        det.appendChild(empty);
        return det;
      }

      for (const c of comments) {
        const item = document.createElement("div");
        item.className = "sb-history-comment";
        const loc = `${c.file || ""}${c.line_start ? `:L${c.line_start}${c.line_end && c.line_end !== c.line_start ? `-${c.line_end}` : ""}` : ""}`;
        let html =
          `<div class="sb-hc-head"><span class="sb-badge ${escapeAttr(c.type)}">${escapeHtml(c.type)}</span> <code>${escapeHtml(loc)}</code></div>` +
          (c.body ? `<div class="sb-hc-body">${escapeHtml(c.body)}</div>` : "");
        // The response this comment received, if recorded.
        const route = c.resolution_route;
        if (route || c.resolution_summary || c.resulting_commit_sha) {
          const routeLabel = { rework: "↳ rework", answer: "↳ 답변", "out-of-scope": "↳ out-of-scope" }[route] || "↳ 응답";
          const sha = c.resulting_commit_sha ? ` <code>${escapeHtml(String(c.resulting_commit_sha).slice(0, 7))}</code>` : "";
          html += `<div class="sb-hc-response"><span class="sb-hc-route">${escapeHtml(routeLabel)}</span>${sha}` +
            (c.resolution_summary ? `<div class="sb-hc-summary">${escapeHtml(c.resolution_summary)}</div>` : "") +
            `</div>`;
        }
        item.innerHTML = html;
        det.appendChild(item);
      }
      return det;
    }

    function makeBadge(text, kind) {
      const s = document.createElement("span");
      s.className = `sb-badge ${kind}`;
      s.textContent = text;
      return s;
    }

    function countComments(sha) {
      let nc = 0, q = 0, oos = 0;
      for (const c of state.feedback.comments) {
        if (c.commit_sha !== sha) continue;
        if (c.type === "needs-change") nc++;
        else if (c.type === "question") q++;
        else if (c.type === "out-of-scope") oos++;
      }
      return { needsChange: nc, question: q, outOfScope: oos };
    }

    function computeVerdict(sha) {
      const stat = state.feedback.commit_status[sha];
      if (stat?.out_of_scope) return "out-of-scope";
      const counts = countComments(sha);
      if (counts.needsChange > 0) return "needs-change";
      if (counts.question > 0) return "question";
      return "approved";
    }

    // ---------- Main panel ----------
    async function renderMain() {
      const main = document.querySelector("#main");
      if (!state.activeSha) {
        state.rendered = { sha: null, mode: null, status: null };
        main.innerHTML = `<div class="empty-main">No commits in this review.</div>`;
        return;
      }
      const commit = state.model.commits.find((c) => c.sha === state.activeSha);
      if (!commit) {
        state.rendered = { sha: null, mode: null, status: null };
        main.innerHTML = `<div class="empty-main">Commit not found.</div>`;
        return;
      }

      // Incremental path: same commit, same mode, same submit-state →
      // only refresh the bits that depend on feedback (toolbar checkboxes,
      // OOS dim/banner, inline comment threads, sidebar). Diff DOM is
      // preserved so scroll position and Diff2Html/hljs work isn't redone.
      if (
        state.rendered.sha === commit.sha &&
        state.rendered.mode === state.diffMode &&
        state.rendered.status === state.feedback.review_status &&
        main.querySelector("#diff-area")
      ) {
        updateVerdictToolbar(commit);
        refreshInlineComments(commit);
        return;
      }

      main.innerHTML = "";
      state.rendered = {
        sha: commit.sha,
        mode: state.diffMode,
        status: state.feedback.review_status,
      };

      if (state.feedback.review_status === "submitted") {
        const banner = document.createElement("div");
        banner.className = "submitted-banner";
        banner.innerHTML = `리뷰가 제출되었습니다. 채팅에 <strong>리뷰 완료</strong>를 입력해주세요. <span class="read-only-badge">(read-only)</span>`;
        main.appendChild(banner);
      }

      // Header
      const header = document.createElement("div");
      header.className = "commit-header";
      const metaRow = `
        <div class="commit-meta-row">
          <span class="commit-sha-pill">${escapeHtml(commit.short_sha)}</span>
          <span>${escapeHtml(commit.author)}</span>
          <span>${escapeHtml(commit.timestamp)}</span>
          <span>+${commit.additions}/-${commit.deletions}</span>
          <span>${commit.files_changed.length} files</span>
        </div>
        <div class="commit-subject">${escapeHtml(commit.message_subject)}</div>
      `;
      header.innerHTML = metaRow;
      if (commit.message_body && commit.message_body.trim()) {
        const body = document.createElement("div");
        body.className = "commit-body";
        body.textContent = commit.message_body;
        const bodyLines = commit.message_body.split(/\r?\n/).length;
        header.appendChild(body);
        if (bodyLines >= 3) {
          const toggle = document.createElement("button");
          toggle.className = "commit-body-toggle";
          toggle.textContent = "전체 보기";
          toggle.addEventListener("click", () => {
            body.classList.toggle("expanded");
            toggle.textContent = body.classList.contains("expanded") ? "접기" : "전체 보기";
          });
          header.appendChild(toggle);
        } else {
          body.classList.add("expanded");
        }
      }
      main.appendChild(header);

      // Verdict toolbar
      const stat = state.feedback.commit_status[commit.sha] || { viewed: false, out_of_scope: false };
      const tb = document.createElement("div");
      tb.className = "verdict-toolbar";
      tb.innerHTML = `
        <label><input type="checkbox" id="tb-viewed" ${stat.viewed ? "checked" : ""}> Viewed</label>
        <label><input type="checkbox" id="tb-oos" ${stat.out_of_scope ? "checked" : ""}> Out of scope</label>
        <span class="toolbar-spacer"></span>
        <span class="out-of-scope-banner" id="oos-banner">${stat.out_of_scope ? "이 커밋은 리뷰 범위 외로 표시됨" : ""}</span>
      `;
      main.appendChild(tb);
      const submitted = state.feedback.review_status === "submitted";
      const tbViewed = tb.querySelector("#tb-viewed");
      const tbOos = tb.querySelector("#tb-oos");
      tbViewed.disabled = submitted;
      tbOos.disabled = submitted;
      tbViewed.addEventListener("change", () => toggleViewed(commit.sha, tbViewed.checked));
      tbOos.addEventListener("change", () => toggleOutOfScope(commit.sha, tbOos.checked));

      // Files list
      const filesBox = document.createElement("div");
      filesBox.className = "files-list";
      const modeUnified = state.diffMode === "unified";
      filesBox.innerHTML = `
        <div class="files-list-header">
          <span>Files changed (${commit.files_changed.length})</span>
          <span class="files-list-toggle">
            <button class="toggle-btn ${modeUnified ? "active" : ""}" data-mode="unified">Unified</button>
            <button class="toggle-btn ${modeUnified ? "" : "active"}" data-mode="side-by-side">Split</button>
          </span>
        </div>
        <ul></ul>
      `;
      const ul = filesBox.querySelector("ul");
      for (const f of commit.files_changed) {
        const li = document.createElement("li");
        li.innerHTML =
          `<span class="file-path">${escapeHtml(f.path)}</span>` +
          `<span class="file-kind ${f.kind}">${f.kind}${f.binary ? " · binary" : ""}</span>` +
          `<span class="file-stats"><span class="add">+${f.additions}</span> <span class="del">-${f.deletions}</span></span>`;
        li.addEventListener("click", () => {
          const target = document.querySelector(`[data-file-anchor="${cssEscape(f.path)}"]`);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        ul.appendChild(li);
      }
      filesBox.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.diffMode = btn.dataset.mode;
          localStorage.setItem("devreview.diffMode", state.diffMode);
          renderMain();
        });
      });
      main.appendChild(filesBox);

      // Diff area
      const diffArea = document.createElement("div");
      const submittedNow = state.feedback.review_status === "submitted";
      diffArea.className = "diff-area"
        + (stat.out_of_scope ? " dimmed" : "")
        + (submittedNow ? " submitted" : "");
      diffArea.id = "diff-area";
      main.appendChild(diffArea);

      let rawDiff;
      try {
        rawDiff = await loadRawDiff(commit);
      } catch (err) {
        diffArea.innerHTML = `<div class="empty-main">diff 로드 실패: ${escapeHtml(err.message)}</div>`;
        return;
      }

      const ui = new Diff2HtmlUI(diffArea, rawDiff, {
        outputFormat: state.diffMode === "side-by-side" ? "side-by-side" : "line-by-line",
        drawFileList: false,
        matching: "lines",
        highlight: true,
      }, window.hljs);
      ui.draw();
      try { ui.highlightCode(); } catch { /* hljs optional */ }

      // Decorate file wrappers with anchors and attach drag handlers
      decorateDiffArea(diffArea, commit);
      renderInlineComments(diffArea, commit);
    }

    // Update only the verdict toolbar's checkbox states + dim banner —
    // does not rebuild DOM, so event handlers and focus survive.
    function updateVerdictToolbar(commit) {
      const stat = state.feedback.commit_status[commit.sha] || { viewed: false, out_of_scope: false };
      const tbViewed = document.querySelector("#tb-viewed");
      const tbOos = document.querySelector("#tb-oos");
      if (tbViewed) tbViewed.checked = !!stat.viewed;
      if (tbOos) tbOos.checked = !!stat.out_of_scope;
      const banner = document.querySelector("#oos-banner");
      if (banner) banner.textContent = stat.out_of_scope ? "이 커밋은 리뷰 범위 외로 표시됨" : "";
      const diffArea = document.querySelector("#diff-area");
      if (diffArea) diffArea.classList.toggle("dimmed", !!stat.out_of_scope);
    }

    // Re-render only the inline comment threads. Existing diff DOM is left
    // alone — we tear out previous .comment-thread rows and insert fresh
    // ones from current feedback. Cheap relative to a full Diff2Html redraw.
    function refreshInlineComments(commit) {
      const diffArea = document.querySelector("#diff-area");
      if (!diffArea) return;
      diffArea.querySelectorAll("tr.comment-thread").forEach((tr) => tr.remove());
      renderInlineComments(diffArea, commit);
    }

    async function loadRawDiff(commit) {
      if (state.diffCache.has(commit.sha)) return state.diffCache.get(commit.sha);
      const res = await fetch(commit.raw_diff_path, { cache: "no-store" });
      if (!res.ok) throw new Error(`raw diff fetch ${commit.raw_diff_path} → ${res.status}`);
      const txt = await res.text();
      state.diffCache.set(commit.sha, txt);
      return txt;
    }

    // ---------- Diff decoration & drag-to-comment ----------
    function decorateDiffArea(root, commit) {
      const wrappers = root.querySelectorAll(".d2h-file-wrapper");
      for (const w of wrappers) {
        const fileNameEl = w.querySelector(".d2h-file-name");
        const fileName = fileNameEl ? fileNameEl.textContent.trim() : "";
        // Resolve to actual files_changed entry by best match (handles renames where d2h shows "old → new")
        const f = commit.files_changed.find((x) => fileName.endsWith(x.path) || fileName === x.path)
                || commit.files_changed.find((x) => x.path.endsWith(fileName));
        const path = f ? f.path : fileName;
        w.dataset.fileAnchor = path;
        w.setAttribute("data-file-anchor", path);

        if (f && f.binary) {
          // No anchoring or comment widgets for binary files.
          continue;
        }

        const rows = w.querySelectorAll("table tr");
        for (const tr of rows) {
          // diff2html line cells:
          //   line-by-line: td.d2h-code-linenumber (single side per row)
          //   side-by-side: two halves, each with td.d2h-code-side-linenumber
          const sideCells = tr.querySelectorAll(".d2h-code-side-linenumber, .d2h-code-linenumber");
          if (sideCells.length === 0) continue;
          for (const cell of sideCells) {
            // Each cell carries the line number text in either the cell or a child .line-num1/.line-num2.
            const text = cell.textContent.trim();
            const num = parseInt(text, 10);
            if (!Number.isFinite(num)) continue;
            // Determine side: in line-by-line, distinguish by which span exists.
            // The cell may contain .line-num1 (old) and .line-num2 (new). Use whichever has a number.
            let side = "new";
            const num1 = cell.querySelector(".line-num1");
            const num2 = cell.querySelector(".line-num2");
            if (num1 && num2) {
              const n1 = parseInt(num1.textContent.trim(), 10);
              const n2 = parseInt(num2.textContent.trim(), 10);
              if (Number.isFinite(n2)) { side = "new"; }
              else if (Number.isFinite(n1)) { side = "old"; }
            } else if (cell.classList.contains("d2h-code-side-linenumber")) {
              // Side-by-side: figure out from parent cell index — left half = old, right half = new.
              const tdIdx = Array.from(tr.children).indexOf(cell);
              side = tdIdx <= 1 ? "old" : "new";
            }
            cell.dataset.line = num;
            cell.dataset.side = side;
            cell.dataset.file = path;
          }
        }

        attachDragHandlers(w, commit, path);
      }
    }

    function attachDragHandlers(wrapper, commit, file) {
      if (state.feedback.review_status === "submitted") return;
      let dragStart = null;
      const onMouseDown = (e) => {
        const cell = e.target.closest(".d2h-code-side-linenumber, .d2h-code-linenumber");
        if (!cell || !cell.dataset.line) return;
        dragStart = {
          line: parseInt(cell.dataset.line, 10),
          side: cell.dataset.side,
          file: cell.dataset.file,
          tr: cell.closest("tr"),
        };
        e.preventDefault();
      };
      const onMouseMove = (e) => {
        if (!dragStart) return;
        const cell = e.target.closest(".d2h-code-side-linenumber, .d2h-code-linenumber");
        if (!cell || cell.dataset.side !== dragStart.side || cell.dataset.file !== dragStart.file) return;
        clearRangeHighlight(wrapper);
        const endLine = parseInt(cell.dataset.line, 10);
        highlightRange(wrapper, dragStart.side, dragStart.file, Math.min(dragStart.line, endLine), Math.max(dragStart.line, endLine));
      };
      const onMouseUp = (e) => {
        if (!dragStart) return;
        const cell = e.target.closest(".d2h-code-side-linenumber, .d2h-code-linenumber");
        const start = dragStart;
        dragStart = null;
        clearRangeHighlight(wrapper);
        if (!cell) return;
        if (cell.dataset.side !== start.side || cell.dataset.file !== start.file) return;
        const endLine = parseInt(cell.dataset.line, 10);
        const lineStart = Math.min(start.line, endLine);
        const lineEnd = Math.max(start.line, endLine);
        openCommentPopup({
          commit_sha: commit.sha,
          file: start.file,
          side: start.side,
          line_start: lineStart,
          line_end: lineEnd,
        });
      };
      wrapper.addEventListener("mousedown", onMouseDown);
      wrapper.addEventListener("mousemove", onMouseMove);
      wrapper.addEventListener("mouseup", onMouseUp);
      wrapper.addEventListener("mouseleave", () => { dragStart = null; clearRangeHighlight(wrapper); });
    }

    function highlightRange(wrapper, side, file, start, end) {
      const cells = wrapper.querySelectorAll(".d2h-code-side-linenumber, .d2h-code-linenumber");
      for (const cell of cells) {
        if (cell.dataset.side !== side) continue;
        if (cell.dataset.file !== file) continue;
        const n = parseInt(cell.dataset.line, 10);
        if (n >= start && n <= end) {
          cell.closest("tr").classList.add("range-selected");
        }
      }
    }
    function clearRangeHighlight(wrapper) {
      wrapper.querySelectorAll("tr.range-selected").forEach((r) => r.classList.remove("range-selected"));
    }

    // ---------- Inline comment rendering ----------
    function renderInlineComments(root, commit) {
      const byAnchor = new Map(); // key = file|side|line_end → [comments]
      for (const c of state.feedback.comments) {
        if (c.commit_sha !== commit.sha) continue;
        const key = `${c.file}|${c.side}|${c.line_end}`;
        const arr = byAnchor.get(key) || [];
        arr.push(c);
        byAnchor.set(key, arr);
      }

      const wrappers = root.querySelectorAll(".d2h-file-wrapper");
      for (const w of wrappers) {
        const path = w.dataset.fileAnchor;
        const cells = w.querySelectorAll(".d2h-code-side-linenumber, .d2h-code-linenumber");
        const seenKeys = new Set();
        for (const cell of cells) {
          if (cell.dataset.file !== path) continue;
          const key = `${cell.dataset.file}|${cell.dataset.side}|${cell.dataset.line}`;
          if (seenKeys.has(key)) continue;
          const arr = byAnchor.get(key);
          if (!arr) continue;
          seenKeys.add(key);
          const tr = cell.closest("tr");
          const widgetTr = buildCommentThreadRow(arr, commit);
          tr.parentNode.insertBefore(widgetTr, tr.nextSibling);
        }
      }
    }

    function buildCommentThreadRow(comments, commit) {
      const tr = document.createElement("tr");
      tr.className = "comment-thread";
      const td = document.createElement("td");
      td.colSpan = 8;
      const inner = document.createElement("div");
      inner.className = "comment-thread-inner";
      for (const c of comments) {
        inner.appendChild(buildCommentEl(c, commit));
      }
      td.appendChild(inner);
      tr.appendChild(td);
      return tr;
    }

    function buildCommentEl(c, commit) {
      const el = document.createElement("div");
      el.className = "comment";
      const lineLabel = c.line_start === c.line_end ? `L${c.line_start}` : `L${c.line_start}–L${c.line_end}`;
      const head = document.createElement("div");
      head.className = "comment-head";
      head.innerHTML =
        `<span class="comment-type-badge ${c.type}">${escapeHtml(c.type)}</span>` +
        `<span class="comment-anchor">${escapeHtml(c.file)}:${escapeHtml(lineLabel)} (${escapeHtml(c.side)})</span>`;
      const actions = document.createElement("div");
      actions.className = "comment-actions";
      if (state.feedback.review_status !== "submitted") {
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => openCommentPopup({ ...c, isEdit: true }));
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => deleteComment(c.id));
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
      }
      head.appendChild(actions);
      el.appendChild(head);
      const body = document.createElement("div");
      body.className = "comment-body";
      body.textContent = c.body || "(빈 코멘트)";
      el.appendChild(body);
      if (c.type === "needs-change") {
        const agent = document.createElement("div");
        agent.className = "comment-agent";
        const isAvailable = (state.model.available_agents || []).some((a) => a.name === c.dispatch_agent);
        agent.textContent = `→ ${c.dispatch_agent || "(no agent)"}`;
        el.appendChild(agent);
        if (!isAvailable) {
          const warn = document.createElement("div");
          warn.className = "comment-stale-warning";
          warn.textContent = "⚠ 이 dispatch_agent는 현재 라운드에서 사용할 수 없습니다. 코멘트를 수정해주세요.";
          el.appendChild(warn);
        }
      }
      return el;
    }

    // ---------- Comment popup ----------
    function openCommentPopup(opts) {
      // opts: { commit_sha, file, side, line_start, line_end, [id, type, body, dispatch_agent, isEdit] }
      const isEdit = opts.isEdit === true;
      const lineLabel = opts.line_start === opts.line_end ? `L${opts.line_start}` : `L${opts.line_start}–L${opts.line_end}`;

      const backdrop = document.createElement("div");
      backdrop.className = "popup-backdrop";
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.innerHTML = `
        <h3>${isEdit ? "Edit comment" : "New comment"}</h3>
        <div class="popup-anchor">${escapeHtml(opts.file)} · ${escapeHtml(lineLabel)} (${escapeHtml(opts.side)})</div>
        <div class="popup-types">
          <label data-type="needs-change"><input type="radio" name="ctype" value="needs-change"> needs-change</label>
          <label data-type="question"><input type="radio" name="ctype" value="question"> question</label>
          <label data-type="out-of-scope"><input type="radio" name="ctype" value="out-of-scope"> out-of-scope</label>
        </div>
        <textarea placeholder="코멘트 내용 (선택)"></textarea>
        <div class="popup-agent" style="display:none">
          <label>Dispatch agent <span style="color:var(--danger)">*</span></label>
          <select>
            <option value="">— select —</option>
            ${(state.model.available_agents || []).map((a) =>
              `<option value="${escapeAttr(a.name)}">${escapeHtml(a.name)} — ${escapeHtml(a.description || "")}</option>`
            ).join("")}
          </select>
        </div>
        <div class="popup-error" style="display:none"></div>
        <div class="popup-actions">
          <button class="btn-cancel">Cancel</button>
          ${isEdit ? '<button class="btn-delete" style="margin-right:auto;color:var(--danger);border-color:var(--danger)">Delete</button>' : ""}
          <button class="btn-primary" disabled>Save</button>
        </div>
      `;
      backdrop.appendChild(popup);
      document.body.appendChild(backdrop);

      const ta = popup.querySelector("textarea");
      const agentBox = popup.querySelector(".popup-agent");
      const agentSelect = popup.querySelector(".popup-agent select");
      const saveBtn = popup.querySelector(".btn-primary");
      const errorBox = popup.querySelector(".popup-error");
      const typeLabels = popup.querySelectorAll(".popup-types label");
      const typeRadios = popup.querySelectorAll('input[name="ctype"]');

      function selectedType() {
        for (const r of typeRadios) if (r.checked) return r.value;
        return null;
      }
      function refresh() {
        const t = selectedType();
        typeLabels.forEach((l) => l.classList.toggle("checked", l.dataset.type === t));
        agentBox.style.display = t === "needs-change" ? "" : "none";
        const agentOk = t !== "needs-change" || (agentSelect.value && (state.model.available_agents || []).some((a) => a.name === agentSelect.value));
        saveBtn.disabled = !t || !agentOk;
      }
      typeRadios.forEach((r) => r.addEventListener("change", refresh));
      agentSelect.addEventListener("change", refresh);

      // Pre-fill on edit
      if (isEdit) {
        ta.value = opts.body || "";
        for (const r of typeRadios) if (r.value === opts.type) r.checked = true;
        if (opts.dispatch_agent) agentSelect.value = opts.dispatch_agent;
        refresh();
      }

      popup.querySelector(".btn-cancel").addEventListener("click", () => backdrop.remove());
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });
      if (isEdit) {
        popup.querySelector(".btn-delete").addEventListener("click", async () => {
          await deleteComment(opts.id);
          backdrop.remove();
        });
      }
      saveBtn.addEventListener("click", async () => {
        const t = selectedType();
        const payload = {
          commit_sha: opts.commit_sha,
          file: opts.file,
          side: opts.side,
          line_start: opts.line_start,
          line_end: opts.line_end,
          type: t,
          body: ta.value,
          dispatch_agent: t === "needs-change" ? agentSelect.value : null,
        };
        try {
          if (isEdit) {
            await apiSend("PATCH", `api/comment/${opts.id}`, {
              type: t, body: ta.value, dispatch_agent: payload.dispatch_agent,
            });
          } else {
            await apiSend("POST", "api/comment", payload);
          }
          backdrop.remove();
          await refreshFeedback();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = "";
        }
      });
    }

    async function deleteComment(id) {
      if (!confirm("이 코멘트를 삭제할까요?")) return;
      try {
        await apiSend("DELETE", `api/comment/${id}`);
        await refreshFeedback();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleViewed(sha, viewed) {
      try {
        await apiSend("POST", "api/commit-status", { commit_sha: sha, viewed });
        await refreshFeedback();
      } catch (err) {
        alert(err.message);
      }
    }
    async function toggleOutOfScope(sha, oos) {
      try {
        await apiSend("POST", "api/commit-status", { commit_sha: sha, out_of_scope: oos });
        await refreshFeedback();
      } catch (err) {
        alert(err.message);
      }
    }

    async function refreshFeedback() {
      state.feedback = await apiGet("feedback.json");
      if (!Array.isArray(state.feedback.comments)) state.feedback.comments = [];
      if (!state.feedback.commit_status) state.feedback.commit_status = {};
      renderAll();
    }

    // ---------- Submit ----------
    function renderSubmit() {
      const btn = document.querySelector("#btn-submit");
      const reopenBtn = document.querySelector("#btn-reopen");
      const hint = document.querySelector("#submit-hint");
      const submitted = state.feedback.review_status === "submitted";

      // Block: any needs-change without valid dispatch_agent
      const orphanNeeds = state.feedback.comments.filter(
        (c) => c.type === "needs-change" && !(state.model.available_agents || []).some((a) => a.name === c.dispatch_agent)
      );
      const blocked = orphanNeeds.length > 0;

      // Warn: any unviewed commit not marked out-of-scope
      const unviewed = state.model.commits.filter((c) => {
        const s = state.feedback.commit_status[c.sha] || {};
        return !s.viewed && !s.out_of_scope;
      });

      if (submitted) {
        btn.disabled = true;
        btn.textContent = "Submitted";
        hint.textContent = `'리뷰 완료'를 입력하면 이 라운드가 history로 남고 새 라운드가 열립니다. 제출을 되돌리려면 Reopen.`;
        reopenBtn.style.display = "";
        reopenBtn.onclick = async () => {
          try {
            await apiSend("POST", "api/reopen");
            await refreshFeedback();
          } catch (err) {
            alert(err.message);
          }
        };
        return;
      }
      reopenBtn.style.display = "none";
      btn.disabled = blocked;
      btn.textContent = "Submit review";
      if (blocked) {
        hint.textContent = `dispatch_agent가 누락된 needs-change 코멘트 ${orphanNeeds.length}개`;
      } else if (unviewed.length > 0) {
        hint.textContent = `${unviewed.length}개의 커밋을 아직 보지 않았습니다 (제출 시 확인됨)`;
      } else {
        hint.textContent = "";
      }

      btn.onclick = async () => {
        if (unviewed.length > 0) {
          if (!confirm(`커밋 ${unviewed.length}개를 보지 않았습니다. 그래도 제출하시겠습니까?`)) return;
        }
        try {
          await apiSend("POST", "api/submit");
          await refreshFeedback();
        } catch (err) {
          alert(err.message);
        }
      };
    }

    // ---------- Utilities ----------
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function cssEscape(s) {
      if (window.CSS && window.CSS.escape) return CSS.escape(s);
      return String(s).replace(/(["\\])/g, "\\$1");
    }

    load();
  })();
  </script>
</body>
</html>
