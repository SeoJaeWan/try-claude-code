interface:
  display_name: "Shape"
  short_description: "Investigate changes with focused parallel research"
  default_prompt: "Use $workbench:shape to investigate this change, delegate useful independent research with selected profiles, and return the analysis."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Inspect linked Figma evidence"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: false
